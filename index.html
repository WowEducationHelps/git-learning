<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Cost. — Liquid Budget</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#FAF5EA; --cream-2:#F4EBDB;
    --ink:#161310;
    --dot:#F2A24A;             /* Dot / period orange */
    --gold-ink:#8C6A35;        /* type sitting near the liquid */
    --amber-deep:#7A4B0E;
    --panel:#2A2724;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:var(--cream);
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
    touch-action:none;overscroll-behavior:none}
  body{font-family:"Inter",-apple-system,system-ui,sans-serif;color:var(--ink);
    background:radial-gradient(120% 90% at 50% 0%,#FDF9F1 0%,var(--cream) 55%,var(--cream-2) 100%)}

canvas#liquid{position:fixed;inset:0;width:100%;height:100%;display:block}

/* ––––– interface layer: rotates as one object ––––– */
#ui{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
pointer-events:none;will-change:transform}
#ui > *{pointer-events:auto}
.brand{position:absolute;left:28px;top:calc(22px + env(safe-area-inset-top));
font-family:“Cormorant Garamond”,Georgia,serif;font-weight:400;font-size:44px;letter-spacing:-.02em;
line-height:1;color:var(–ink);pointer-events:none}
.brand b{color:var(–dot);font-weight:500}
.prod{position:absolute;left:30px;top:calc(76px + env(safe-area-inset-top));font-size:11px;letter-spacing:.14em;
text-transform:uppercase;color:#9A8A70;pointer-events:none}

/* action control */
.act{position:absolute;right:24px;top:calc(22px + env(safe-area-inset-top));width:52px;height:52px;border-radius:50%;
border:0;background:#FFF9EF;box-shadow:0 8px 24px rgba(120,80,20,.12),0 1px 0 #fff inset;
display:grid;place-items:center;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.act:active{transform:scale(.92)}
.act svg{width:20px;height:20px;stroke:var(–dot);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.act:focus-visible{outline:2px solid var(–dot);outline-offset:3px}

.menu{position:absolute;right:24px;top:calc(86px + env(safe-area-inset-top));width:236px;
background:var(–panel);color:#F6EEDF;border-radius:20px;padding:6px 0;
box-shadow:0 24px 60px rgba(40,25,5,.28);
opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top right;
transition:opacity .22s ease,transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.menu.open{opacity:1;transform:none;visibility:visible}
.menu::before{content:””;position:absolute;top:-6px;right:20px;width:12px;height:12px;background:var(–panel);transform:rotate(45deg);border-radius:2px}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 20px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;font:inherit}
.menu button + button{border-top:1px solid rgba(255,255,255,.08)}
.menu button:active{background:rgba(255,255,255,.05)}
.menu svg{width:20px;height:20px;stroke:#E6D9C2;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu strong{display:block;font-weight:500;font-size:15px;letter-spacing:-.01em}
.menu strong.hot{color:#F0B25F}
.menu span{display:block;font-size:12.5px;color:#A79C89;margin-top:2px}

/* budget used */
.pct{position:absolute;left:0;right:0;text-align:center;pointer-events:none;
transform:translateY(-100%)}
.pct .eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(–gold-ink);opacity:.85}
.pct .eyebrow::before,.pct .eyebrow::after{content:”·”;margin:0 14px;opacity:.6}
.pct .num{font-family:“Cormorant Garamond”,Georgia,serif;font-weight:300;font-size:132px;line-height:.9;
color:var(–gold-ink);letter-spacing:-.03em;margin-top:8px}
.pct .num small{font-size:48px;vertical-align:baseline;margin-left:6px;letter-spacing:0}

/* bottom figures */
.figs{position:absolute;left:28px;right:28px;bottom:calc(32px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;
pointer-events:none;color:#FFF5E3}
.figs div{display:flex;flex-direction:column;gap:5px}
.figs div:nth-child(2){text-align:center}
.figs div:nth-child(3){text-align:right}
.figs label{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;opacity:.72}
.figs strong{font-family:“Cormorant Garamond”,Georgia,serif;font-weight:500;font-size:22px;letter-spacing:-.01em}

/* speech */
.say{position:absolute;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));transform:translate(-50%,6px);
max-width:78%;padding:11px 16px;border-radius:16px;
background:rgba(255,250,240,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
color:#3A2A12;font-size:13.5px;line-height:1.4;text-align:center;
box-shadow:0 10px 30px rgba(90,55,10,.15);opacity:0;transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.say.on{opacity:1;transform:translate(-50%,0)}

/* permission */
.perm{position:fixed;left:50%;bottom:calc(26% + env(safe-area-inset-bottom));transform:translateX(-50%);
padding:12px 22px;border-radius:999px;border:1px solid rgba(140,106,53,.35);
background:rgba(255,250,240,.9);color:var(–gold-ink);font:500 13px/1 “Inter”,sans-serif;letter-spacing:.06em;
cursor:pointer;box-shadow:0 10px 30px rgba(90,55,10,.12);z-index:20;display:none}
.perm.show{display:block}

/* ––––– DEV ONLY: remove this block + #dev markup + Dev module later ––––– */
#dev{position:fixed;left:12px;bottom:12px;z-index:30;display:none;
background:rgba(20,18,15,.82);color:#EADFCB;border-radius:14px;padding:10px;font-size:11px;
backdrop-filter:blur(8px);width:190px;font-family:ui-monospace,Menlo,monospace}
#dev.show{display:block}
#dev .row{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
#dev button{flex:1;padding:6px 4px;border:0;border-radius:8px;background:#3A352E;color:inherit;font:inherit;cursor:pointer}
#dev button:hover{background:#4A4238}
#dev .pad{position:relative;height:110px;border-radius:10px;background:#2A2723;cursor:crosshair;overflow:hidden}
#dev .pad i{position:absolute;width:12px;height:12px;border-radius:50%;background:var(–dot);left:50%;top:50%;transform:translate(-50%,-50%)}
#dev .pad::before,#dev .pad::after{content:””;position:absolute;background:#3D3730}
#dev .pad::before{left:50%;top:0;bottom:0;width:1px}#dev .pad::after{top:50%;left:0;right:0;height:1px}
#dev p{opacity:.6;margin-top:6px;line-height:1.5}

/* production pager */
.pager{position:absolute;left:0;right:0;top:calc(84px + env(safe-area-inset-top));display:flex;justify-content:center;gap:7px;pointer-events:none}
.pager i{width:5px;height:5px;border-radius:50%;background:#C9B48F;opacity:.5;transition:all .3s}
.pager i.on{background:var(–dot);opacity:1;width:16px;border-radius:3px}
.fade{transition:opacity .25s}
.fade.out{opacity:0}

/* Take Action screen */
.sheet{position:absolute;inset:0;background:rgba(250,245,234,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;
padding:calc(18px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom));touch-action:pan-y}
.sheet.open{transform:none}
.sheet header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.sheet header button{width:40px;height:40px;border-radius:50%;border:0;background:#FFF9EF;box-shadow:0 6px 18px rgba(120,80,20,.12);font-size:18px;color:var(–gold-ink);cursor:pointer}
.sheet h2{font-family:“Cormorant Garamond”,Georgia,serif;font-weight:400;font-size:34px;letter-spacing:-.02em;line-height:1}
.sheet h2 b{color:var(–dot);font-weight:500}
.sheet .sub{font-size:12px;color:#9A8A70;letter-spacing:.06em;margin-top:6px}
.sheet .list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.item{display:flex;gap:14px;align-items:flex-start;padding:16px 0;border-bottom:1px solid rgba(140,106,53,.16)}
.item .d{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(–dot)}
.item .d.late{background:#C8462B}.item .d.soft{background:#C9B48F}
.item .t{flex:1}
.item strong{display:block;font-weight:500;font-size:15px;letter-spacing:-.01em}
.item span{display:block;font-size:12.5px;color:#8A7A60;margin-top:3px;line-height:1.4}
.item em{font-style:normal;font-family:“Cormorant Garamond”,Georgia,serif;font-size:20px;font-weight:500;white-space:nowrap}
.item .chips{display:flex;gap:6px;margin-top:10px}
.chip{padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:500;border:1px solid rgba(140,106,53,.3);background:transparent;color:var(–gold-ink);cursor:pointer;font-family:inherit}
.chip.primary{background:var(–ink);color:#FAF5EA;border-color:var(–ink)}
.item.done{opacity:.35;transition:opacity .4s}
.sheet .empty{text-align:center;color:#9A8A70;font-size:13px;padding:40px 0}
</style>

</head>
<body>

<canvas id="liquid"></canvas>

<div id="ui">
  <div class="brand">Cost<b>.</b></div>
  <div class="prod fade" id="prod"></div>
  <div class="pager" id="pager"></div>

  <button class="act" id="actBtn" aria-label="Actions" aria-expanded="false">
    <svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>
  </button>
  <div class="menu" id="menu" role="menu">
    <button role="menuitem" data-act="attention"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l2.5 2"/><circle cx="18.5" cy="6" r="1.6" fill="#F0B25F" stroke="none"/></svg><div><strong class="hot">Take Action</strong><span>See what needs attention</span></div></button>
    <button role="menuitem" data-act="invoices"><svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6zM14 3v4h4M9 12h6M9 16h6"/></svg><div><strong>Invoices</strong><span>View invoices</span></div></button>
    <button role="menuitem" data-act="net30"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/></svg><div><strong>Net 30s</strong><span>See upcoming payment terms</span></div></button>
    <button role="menuitem" data-act="payments"><svg viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg><div><strong>Payments</strong><span>Track payments</span></div></button>
    <button role="menuitem" data-act="reports"><svg viewBox="0 0 24 24"><path d="M6 20V12M12 20V6M18 20v-4"/></svg><div><strong>Reports</strong><span>View financials</span></div></button>
  </div>

  <div class="pct" id="pct">
    <div class="eyebrow">Budget used</div>
    <div class="num"><span id="pctNum">50</span><small>%</small></div>
  </div>

  <div class="figs">
    <div><label>Total budget</label><strong id="fTotal"></strong></div>
    <div><label>Spent</label><strong id="fSpent"></strong></div>
    <div><label>Remaining</label><strong id="fRemain"></strong></div>
  </div>

  <div class="say" id="say" aria-live="polite"></div>

  <section class="sheet" id="sheet" aria-hidden="true">
    <header><button id="sheetBack" aria-label="Back">←</button><div><h2>Take action<b>.</b></h2><div class="sub" id="sheetSub"></div></div></header>
    <div class="list" id="sheetList"></div>
  </section>
</div>

<button class="perm" id="perm">Enable motion</button>

<!-- DEV ONLY -->

<div id="dev">
  <div class="row">
    <button data-o="0">Portrait</button><button data-o="-90">Land L</button>
  </div>
  <div class="row">
    <button data-o="90">Land R</button><button data-o="180">Upside</button>
  </div>
  <div class="pad" id="pad"><i></i></div>
  <p>drag pad · ←→ rotate · D hides</p>
</div>

<script>
/* ============================================================
   COST. — LIQUID BUDGET PROTOTYPE
   Data lives in CONFIG. Replace with Cost. backend later.
   ============================================================ */
const CONFIG = {
  productions: [
    { name:'Episode 9', totalBudget:100000, spent:50000,
      actions:[
        {t:'Lux Grip & Electric — Invoice #2231', s:'Net 30 ends Friday · approved, unpaid', amt:8400, k:'late'},
        {t:'Approve timecards — Week 6', s:'14 crew · submitted by 1st AD', amt:21750, k:''},
        {t:'Catering deposit — Set Table Co.', s:'Due in 4 days', amt:2200, k:''},
        {t:'Location permit renewal', s:'Expires Sep 2 · City Film Office', amt:650, k:'soft'},
      ]},
    { name:'Episode 10', totalBudget:120000, spent:30000,
      actions:[
        {t:'Camera package hold — Panavision', s:'Deposit due to secure dates', amt:12000, k:''},
        {t:'Approve art dept PO', s:'Set build materials · needs sign-off', amt:4300, k:''},
      ]},
  ],
  currency: 'USD',
  DEV_CONTROLS: false,         // press D on desktop to show the simulator
};
const fmt = n => new Intl.NumberFormat('en-US',{style:'currency',currency:CONFIG.currency,maximumFractionDigits:0}).format(n);
let cur = 0;                                   // active production index
let FILL = 0, fillTarget = 0, fillV = 0;       // animated liquid fraction (by area)
const $ = id => document.getElementById(id);
function prodOf(i){ const p=CONFIG.productions[i]; return {...p, remaining:p.totalBudget-p.spent, fill:Math.min(1,Math.max(0,p.spent/p.totalBudget))}; }
function showProduction(i, instant){
  cur = i; const p = prodOf(i);
  fillTarget = p.fill; if(instant) FILL = p.fill;
  const fadeEls=[$('prod'),$('fTotal'),$('fSpent'),$('fRemain')];
  const apply=()=>{ $('prod').textContent=p.name; $('fTotal').textContent=fmt(p.totalBudget); $('fSpent').textContent=fmt(p.spent); $('fRemain').textContent=fmt(p.remaining); };
  if(instant) apply(); else { fadeEls.forEach(e=>e.classList.add('out')); setTimeout(()=>{apply(); fadeEls.forEach(e=>e.classList.remove('out'))},260); }
  $('pager').innerHTML = CONFIG.productions.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('');
}
['fTotal','fSpent','fRemain'].forEach(id=>$(id).classList.add('fade'));
showProduction(0, true);

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- Assistant hook (swap for the real Cost. AI) -------------- */
const Assistant = {
  async respond(ctx){
    return `You've used ${Math.round(ctx.fill*100)}% of your ${ctx.production} budget. ${fmt(ctx.remaining)} remains.`;
  },
  speak(text){
    if(!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text); u.rate = 1; u.pitch = 1.05;
    speechSynthesis.speak(u);
  }
};

/* ---------------- Canvas + geometry ---------------- */
const cv = document.getElementById('liquid'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(2, devicePixelRatio||1);
  W = innerWidth; H = innerHeight;
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize); resize();

/* gravity direction in screen coords (unit vector), target from sensors */
const grav = { x:0, y:1 };          // target
const S = {                          // smoothed state
  theta: 0, omega: 0,                // container angle in gravity frame + angular velocity
  slosh: 0, sloshV: 0,               // surface tilt (spring)
  amp: 0, phase: 0,                  // travelling wave amplitude
  t: 0
};
// theta such that rotating (0,1) by theta gives gravity: theta = atan2(-gx, gy)
const angleOf = g => Math.atan2(-g.x, g.y);
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

/* liquid surface height along gravity for a given container angle: area-conserving.
   Rectangle W×H is rotated into the gravity frame; find sy so that area{y>=sy} = FILL*W*H */
function rectInFrame(theta){
  const c=Math.cos(theta), s=Math.sin(theta), hw=W/2, hh=H/2;
  // frame = R(-theta) * screen
  return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([x,y])=>[ x*c + y*s, -x*s + y*c ]);
}
function areaBelow(poly, sy){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    const ina=a[1]>=sy, inb=b[1]>=sy;
    if(ina) out.push(a);
    if(ina!==inb){ const t=(sy-a[1])/(b[1]-a[1]); out.push([a[0]+(b[0]-a[0])*t, sy]); }
  }
  let A=0; for(let i=0;i<out.length;i++){ const p=out[i], q=out[(i+1)%out.length]; A+=p[0]*q[1]-q[0]*p[1]; }
  return Math.abs(A)/2;
}
function surfaceLevel(theta){
  const poly=rectInFrame(theta), target=FILL*W*H, R=Math.hypot(W,H)/2;
  let lo=-R, hi=R;
  for(let i=0;i<28;i++){ const m=(lo+hi)/2; (areaBelow(poly,m)>target)?lo=m:hi=m; }
  return (lo+hi)/2;
}

/* wave shape in frame coordinates */
const motionScale = REDUCED ? 0.25 : 1;
function surfaceY(x, sy){
  return sy + S.slosh*x
    + S.amp*Math.sin(x*0.022 + S.phase)*motionScale
    + 2.2*motionScale*Math.sin(x*0.013 + S.t*1.1) + 1.2*motionScale*Math.sin(x*0.031 - S.t*0.7);
}

/* ---------------- Dot (the assistant) ---------------- */
const dot = { x:W/2, y:H*0.65, vx:0, vy:0, r:Math.min(W,H)*0.11, squash:1, squashV:0, blink:0 };
let bubbles=[];
function spawnBubble(deep){ return { x:(Math.random()-.5)*Math.max(W,H), y:deep?Math.random()*H*0.6+H*0.2:0, r:0.8+Math.random()*2.2, v:8+Math.random()*16, w:Math.random()*6.28 }; }
for(let i=0;i<(REDUCED?8:22);i++) bubbles.push(spawnBubble(true));

/* ---------------- Interface layer ---------------- */
const ui = document.getElementById('ui');
let uiSnap = 0, uiAngle = 0;                      // radians (multiples of PI/2)
function layoutUI(snap){
  const sideways = Math.abs(Math.round(snap/(Math.PI/2)))%2===1;
  ui.style.width  = (sideways?H:W)+'px';
  ui.style.height = (sideways?W:H)+'px';
}
layoutUI(0);

/* ---------------- Main loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; S.t+=dt;

  // smooth container angle toward gravity (shortest path)
  const target=angleOf(grav);
  const prev=S.theta;
  const diff=wrap(target-S.theta);
  S.theta += diff*Math.min(1, dt*9);
  const omega = wrap(S.theta-prev)/dt;
  S.omega += (omega-S.omega)*Math.min(1,dt*12);

  // slosh spring driven by rotation speed
  const k=38, c=5.5;
  S.sloshV += (-k*S.slosh - c*S.sloshV - S.omega*0.55)*dt;
  S.slosh  += S.sloshV*dt;
  S.slosh   = Math.max(-0.45, Math.min(0.45, S.slosh));
  // travelling wave amplitude excited by motion, decays
  S.amp += Math.abs(S.omega)*40*dt;
  S.amp *= Math.exp(-dt*1.6); S.amp=Math.min(S.amp, 26);
  S.phase += dt*(3 + Math.abs(S.omega));

  // fill level spring (pouring between productions)
  fillV += ((fillTarget-FILL)*22 - fillV*7)*dt; FILL += fillV*dt;
  $('pctNum').textContent = Math.round(FILL*100);
  const sy = surfaceLevel(S.theta);
  const cs=Math.cos(S.theta), sn=Math.sin(S.theta);
  const toFrame=(x,y)=>{ x-=W/2; y-=H/2; return [x*cs+y*sn, -x*sn+y*cs]; };
  const toScreen=(fx,fy)=>[ fx*cs - fy*sn + W/2, fx*sn + fy*cs + H/2 ];

  /* Dot physics in gravity frame */
  {
    let [fx,fy]=toFrame(dot.x,dot.y);
    let [vx,vy]=[dot.vx*cs+dot.vy*sn, -dot.vx*sn+dot.vy*cs];
    const rest = surfaceY(fx,sy) + dot.r*1.25;         // floats just under the surface
    const under = fy - rest;
    const buoy = -under*(REDUCED?18:14);                 // spring toward rest height
    vy += (buoy - vy*3.2)*dt + 0;                        // damped
    vx += (S.slosh*-160 - vx*1.6 - fx*0.35)*dt;          // slide along tilted surface, settle to centre
    if(!REDUCED) vy += Math.sin(S.t*1.7)*6*dt;          // gentle bob
    fx += vx*dt; fy += vy*dt;
    const lim = Math.min(W,H)/2 - dot.r - 6;
    if(fx> lim){fx= lim; vx*=-0.3} if(fx<-lim){fx=-lim; vx*=-0.3}
    [dot.x,dot.y]=toScreen(fx,fy);
    dot.vx = vx*cs - vy*sn; dot.vy = vx*sn + vy*cs;
    // keep inside the glass
    const m=dot.r+4;
    dot.x=Math.max(m,Math.min(W-m,dot.x)); dot.y=Math.max(m,Math.min(H-m,dot.y));
    // squash spring
    dot.squashV += (-(dot.squash-1)*220 - dot.squashV*10)*dt; dot.squash += dot.squashV*dt;
    dot.blink = Math.max(0, dot.blink - dt);
    if(Math.random()<dt*0.18 && !REDUCED) dot.blink=0.14;
  }

  /* ---------- draw ---------- */
  ctx.clearRect(0,0,W,H);
  ctx.save();
  ctx.translate(W/2,H/2); ctx.rotate(S.theta);
  const R=Math.hypot(W,H)/2+40;

  // liquid body
  ctx.beginPath();
  ctx.moveTo(-R, surfaceY(-R,sy));
  for(let x=-R+8;x<=R;x+=8) ctx.lineTo(x, surfaceY(x,sy));
  ctx.lineTo(R,R); ctx.lineTo(-R,R); ctx.closePath();
  const depth=Math.hypot(W,H);
  const g=ctx.createLinearGradient(0,sy,0,sy+depth*0.8);
  g.addColorStop(0,'rgba(246,190,86,0.92)');
  g.addColorStop(0.25,'rgba(228,158,52,0.95)');
  g.addColorStop(0.7,'rgba(178,112,25,0.97)');
  g.addColorStop(1,'rgba(122,72,12,1)');
  ctx.fillStyle=g; ctx.fill();
  ctx.save(); ctx.clip();

  // depth vignette on the sides
  const vg=ctx.createLinearGradient(-R,0,R,0);
  vg.addColorStop(0,'rgba(90,50,5,0.18)'); vg.addColorStop(0.3,'rgba(90,50,5,0)'); vg.addColorStop(0.7,'rgba(90,50,5,0)'); vg.addColorStop(1,'rgba(90,50,5,0.18)');
  ctx.fillStyle=vg; ctx.fillRect(-R,-R,2*R,2*R);

  // bubbles (rise against gravity)
  ctx.fillStyle='rgba(255,236,200,0.35)'; ctx.strokeStyle='rgba(255,246,225,0.55)'; ctx.lineWidth=0.8;
  for(const b of bubbles){
    if(!REDUCED){ b.y -= b.v*dt; b.x += Math.sin(S.t*1.5+b.w)*6*dt; }
    if(b.y < surfaceY(b.x,sy)+3){ Object.assign(b, spawnBubble(false)); b.y = sy + depth*0.55 + Math.random()*depth*0.2; }
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.fill(); ctx.stroke();
  }

  // Dot
  {
    const [fx,fy]=toFrame(dot.x,dot.y), r=dot.r, sq=dot.squash;
    ctx.save(); ctx.translate(fx,fy); ctx.scale(1/Math.sqrt(sq), sq);
    ctx.beginPath(); ctx.arc(0,0,r,0,6.283);
    const dg=ctx.createRadialGradient(-r*0.35,-r*0.4,r*0.1, 0,0,r*1.05);
    dg.addColorStop(0,'#FFD08A'); dg.addColorStop(0.55,'#F2A24A'); dg.addColorStop(1,'#C9782A');
    ctx.fillStyle=dg; ctx.fill();
    // rim shadow inside liquid
    ctx.beginPath(); ctx.arc(0,0,r,0,6.283); ctx.strokeStyle='rgba(120,65,10,0.25)'; ctx.lineWidth=1.2; ctx.stroke();
    // eyes
    ctx.strokeStyle='#4A2C0F'; ctx.lineWidth=Math.max(1.6,r*0.065); ctx.lineCap='round';
    const ey=-r*0.05, ex=r*0.34, ew=r*0.16, open = dot.blink>0?0.15:1;
    for(const s of [-1,1]){ ctx.beginPath(); ctx.arc(s*ex, ey+ew*open*0.4, ew, Math.PI, 2*Math.PI); ctx.save(); ctx.scale(1,open); ctx.restore(); ctx.stroke(); }
    ctx.restore();
  }

  // surface highlight / meniscus
  ctx.beginPath(); ctx.moveTo(-R,surfaceY(-R,sy));
  for(let x=-R+8;x<=R;x+=8) ctx.lineTo(x,surfaceY(x,sy));
  ctx.strokeStyle='rgba(255,246,222,0.85)'; ctx.lineWidth=2.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-R,surfaceY(-R,sy)+5);
  for(let x=-R+8;x<=R;x+=8) ctx.lineTo(x,surfaceY(x,sy)+5+Math.sin(x*0.05+S.t)*1.2);
  ctx.strokeStyle='rgba(255,230,170,0.35)'; ctx.lineWidth=6; ctx.stroke();
  ctx.restore(); // clip

  // soft glow above the surface
  ctx.beginPath(); ctx.moveTo(-R,surfaceY(-R,sy));
  for(let x=-R+8;x<=R;x+=8) ctx.lineTo(x,surfaceY(x,sy));
  ctx.strokeStyle='rgba(240,180,90,0.25)'; ctx.lineWidth=14; ctx.stroke();
  ctx.restore();

  /* ---------- interface rotation (snapped, animated) ---------- */
  const snapT = Math.round(target/(Math.PI/2))*(Math.PI/2);
  if(Math.abs(wrap(snapT-uiSnap))>0.01 && Math.abs(wrap(target-snapT))<0.62){ uiSnap=snapT; layoutUI(uiSnap); }
  uiAngle += wrap(uiSnap-uiAngle)*Math.min(1,dt*7);
  ui.style.transform=`translate(-50%,-50%) rotate(${uiAngle}rad)`;
  // percentage block sits above the (upright) liquid level
  const uiH = parseFloat(ui.style.height);
  pctEl.style.top = Math.max(uiH*0.2, Math.min(uiH*0.72, uiH*(1-FILL) - 34))+'px';

  requestAnimationFrame(frame);
}
const pctEl=document.getElementById('pct');
requestAnimationFrame(frame);

/* ---------------- Sensors ---------------- */
let sensorSeen=false, motionSeen=false;
function screenAngle(){ return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }
function onOrient(e){
  if(e.beta==null||e.gamma==null) return;
  sensorSeen=true; Dev.hide();
  const b=e.beta*Math.PI/180, gm=e.gamma*Math.PI/180;
  // gravity in device frame: (cos b sin g, -sin b, -cos b cos g)  → screen: x right, y down
  let gx=Math.cos(b)*Math.sin(gm), gy=Math.sin(b);
  const len=Math.hypot(gx,gy);
  if(len<0.12) return;                                   // lying flat: keep last direction
  gx/=len; gy/=len;
  // compensate if the OS rotated the viewport anyway
  const a=-screenAngle()*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
  grav.x = gx*ca - gy*sa; grav.y = gx*sa + gy*ca;
}
function onMotion(e){
  const a=e.accelerationIncludingGravity; if(!a||a.x==null||a.y==null) return;
  
  motionSeen=true; Dev.hide();
  const ios = typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function';
  const sgn = ios?1:-1;                                   // iOS reports gravity, Android reports the reaction force
  let gx=-sgn*a.x, gy=sgn*a.y; const len=Math.hypot(gx,gy); if(len<1.2) return;
  gx/=len; gy/=len;
  const r=-screenAngle()*Math.PI/180, ca=Math.cos(r), sa=Math.sin(r);
  grav.x = gx*ca - gy*sa; grav.y = gx*sa + gy*ca;
}

const perm=document.getElementById('perm');
async function enableMotion(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted') return;
    }
    if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
      try{ await DeviceMotionEvent.requestPermission(); }catch(_){}
    }
    addEventListener('deviceorientation', onOrient, true);
    addEventListener('devicemotion', onMotion, true);
    perm.classList.remove('show'); localStorage.setItem('cost.motion','1');
    setTimeout(()=>{ if(!sensorSeen && !motionSeen){
      perm.textContent = isSecureContext ? 'Motion is blocked here — open this page directly in Chrome or Safari' : 'Motion needs HTTPS — open this page from an https:// link';
      perm.classList.add('show');
    }}, 2000);
  }catch(err){ console.warn(err); }
}
perm.addEventListener('click', enableMotion);
const needsPrompt = typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function';
if(needsPrompt && !localStorage.getItem('cost.motion')){ perm.classList.add('show'); }
else{
  enableMotion();
  // Android sometimes only starts delivering after a user gesture — offer the button if nothing arrives
  setTimeout(()=>{ if(!sensorSeen && !motionSeen && matchMedia('(pointer:coarse)').matches) perm.classList.add('show'); }, 1500);
}
// try to keep the viewport locked (works in fullscreen / PWA; silently ignored elsewhere)
try{ screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(()=>{}); }catch(_){}

/* ---------------- Tap Dot ---------------- */
const say=document.getElementById('say'); let sayT;
async function tapDot(){
  dot.squashV = -9; dot.vy -= 40;
  S.amp = Math.min(26, S.amp + 14); S.sloshV += 0.9;
  const text = await Assistant.respond({fill:FILL, production:CONFIG.production, remaining, spent:CONFIG.spent, total:CONFIG.totalBudget});
  say.textContent=text; say.classList.add('on'); Assistant.speak(text);
  clearTimeout(sayT); sayT=setTimeout(()=>say.classList.remove('on'), 4200);
}
let sw=null;
cv.addEventListener('pointerdown', e=>{ sw={x:e.clientX,y:e.clientY,t:performance.now()}; closeMenu(); });
cv.addEventListener('pointerup', e=>{
  if(!sw) return; const dx=e.clientX-sw.x, dy=e.clientY-sw.y; sw=null;
  // swipe measured in the interface's frame, so it works when the UI is rotated
  const c=Math.cos(-uiSnap), s=Math.sin(-uiSnap); const ux=dx*c-dy*s, uy=dx*s+dy*c;
  if(Math.abs(ux)>56 && Math.abs(ux)>Math.abs(uy)*1.3){ switchProduction(ux<0?1:-1); return; }
  if(Math.hypot(dx,dy)<12 && Math.hypot(e.clientX-dot.x, e.clientY-dot.y) < dot.r*1.4) tapDot();
});
function switchProduction(dir){
  const n=CONFIG.productions.length, next=cur+dir;
  if(next<0||next>=n){ S.sloshV += dir*0.6; return; }      // edge: just a nudge
  showProduction(next);
  // pour: lean the surface the way you swiped, kick a wave, then the level spring does the rest
  S.sloshV += dir*(fillTarget<FILL? 1.6 : -1.6);
  S.amp = Math.min(26, S.amp + 18);
  dot.vy -= 30;
}

/* ---------------- Actions menu ---------------- */
const menu=document.getElementById('menu'), actBtn=document.getElementById('actBtn');
function closeMenu(){ menu.classList.remove('open'); actBtn.setAttribute('aria-expanded','false'); }
actBtn.addEventListener('click', e=>{ e.stopPropagation(); const o=!menu.classList.contains('open'); menu.classList.toggle('open',o); actBtn.setAttribute('aria-expanded',o); });
menu.addEventListener('click', e=>{
  const b=e.target.closest('button'); if(!b) return;
  closeMenu();
  if(b.dataset.act==='attention') openSheet();
  else console.log('action:', b.dataset.act);   // TODO route to the real Cost. screens
});

/* ---------------- Take Action screen (mock) ---------------- */
const sheet=$('sheet');
function openSheet(){
  const p=prodOf(cur), open=p.actions.filter(a=>!a.done);
  $('sheetSub').textContent = `${p.name} · ${open.length} item${open.length===1?'':'s'} need${open.length===1?'s':''} attention · ${fmt(open.reduce((t,a)=>t+a.amt,0))}`;
  $('sheetList').innerHTML = p.actions.length ? p.actions.map((a,i)=>`
    <div class="item ${a.done?'done':''}" data-i="${i}"><div class="d ${a.k}"></div>
      <div class="t"><strong>${a.t}</strong><span>${a.s}</span>
        <div class="chips"><button class="chip primary" data-do="approve">Approve</button><button class="chip" data-do="later">Later</button></div></div>
      <em>${fmt(a.amt)}</em></div>`).join('') : '<div class="empty">Nothing needs attention.</div>';
  sheet.classList.add('open'); sheet.setAttribute('aria-hidden','false');
}
function closeSheet(){ sheet.classList.remove('open'); sheet.setAttribute('aria-hidden','true'); }
$('sheetBack').addEventListener('click', closeSheet);
$('sheetList').addEventListener('click', e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  const item=c.closest('.item'), a=CONFIG.productions[cur].actions[+item.dataset.i];
  if(c.dataset.do==='approve'){ a.done=true; item.classList.add('done'); }
  else { item.style.opacity=.6; }
});

/* ---------------- DEV ONLY: orientation simulator ---------------- */
const Dev = (()=>{
  const el=document.getElementById('dev'), pad=document.getElementById('pad'), knob=pad.querySelector('i');
  let simAngle=0, shown=false;
  const set=(x,y)=>{ const l=Math.hypot(x,y)||1; grav.x=x/l; grav.y=y/l; knob.style.left=(50+grav.x*42)+'%'; knob.style.top=(50+grav.y*42)+'%'; };
  const setAngle=deg=>{ simAngle=deg; const a=deg*Math.PI/180; set(Math.sin(a), Math.cos(a)); };
  el.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',()=>setAngle(+b.dataset.o)));
  let dragging=false;
  const fromEvt=e=>{ const r=pad.getBoundingClientRect(); set((e.clientX-r.left)/r.width*2-1, (e.clientY-r.top)/r.height*2-1); };
  pad.addEventListener('pointerdown',e=>{dragging=true; pad.setPointerCapture(e.pointerId); fromEvt(e)});
  pad.addEventListener('pointermove',e=>dragging&&fromEvt(e));
  pad.addEventListener('pointerup',()=>dragging=false);
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft') setAngle(simAngle-15);
    if(e.key==='ArrowRight') setAngle(simAngle+15);
    if(e.key==='ArrowUp') setAngle(0);
    if(e.key==='ArrowDown') setAngle(180);
    if(e.key.toLowerCase()==='d'){ shown=!shown; el.classList.toggle('show',shown); }
  });
  // auto-show if no sensor data arrives (desktop / simulator)
  setTimeout(()=>{ if(!sensorSeen && !motionSeen && CONFIG.DEV_CONTROLS && !matchMedia('(pointer:coarse)').matches){ shown=true; el.classList.add('show'); } }, 1500);
  return { hide(){ if(shown && !localStorage.getItem('cost.devKeep')){ shown=false; el.classList.remove('show'); } } };
})();
</script>
