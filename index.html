<!DOCTYPE html>
<!--
  Cost. — Liquid Budget prototype
  VERSION HISTORY (newest first). The number is shown bottom-left of the screen.
  v0.63  report renders on load / production change — no placeholder title
  v0.62  Take Action sheet fully hidden when closed; back button is an up arrow
  v0.61  fix: liquid pane has its own cream background
  v0.60  fix: report pane no longer flex-shrinks to one screen
  v0.59  report styled as deeper liquid — amber continues down, cream type
  v0.58  free scrolling — snap-on-settle removed; report list scrolls normally
  v0.57  ROOT FIX: .scroll-page/.liquid-pane/.report-pane CSS was missing entirely
  v0.56  dueLbl CSS actually written this time
  v0.55  rolled back to v0.52 base; dueLbl above plinth; scroll fixed
  v0.47  swipe-down from report top closes it; touch-based on mobile
  v0.46  swipe-up works from anywhere; payroll shows date not day name
  v0.45  lighter translucent honey-gold liquid palette
  v0.44  fix ordering: wheel+drag after all const decls
  v0.43  scroll up from report returns to liquid
  v0.42  scroll opens report; chevron switches projects; left/right arrows switch projects
  v0.41  scroll-down cost report per production; chevron in liquid; distinct data
  v0.40  payroll label says 'DUE'; overdue label bright white
  v0.39  dayName full words; brief text darker; Dot starts in liquid
  v0.38  fix: clamp overdue gradient radii to prevent non-finite
  v0.37  no duplicate synced bar; lighter brighter amber; burgundy overdue tone
  v0.36  full CSS rewrite — single source of truth, no duplicate rules
  v0.35  clean CSS rewrite — single plinth block, no overlapping rules
  v0.34  fix: urgent plinth markup was missing from DOM
  v0.33  priority hierarchy plinth
  v0.32  two-substance glass: bright warm amber (free) above a crisp meniscus line,
         then cooler bronze (committed) below with depth texture; label always readable
  v0.31  plinth: three equal columns with dividers, label above figure
  v0.30  two-row plinth on mobile (confirmed write)
  v0.29  header text larger: wordmark 42px, episode 13px, brief 14px
  v0.28  fix: band fade variable declared before use
  v0.27  softer band and plinth edges; larger plinth figures
  v0.26  readable without words: bright liquid = free cash, darker band = this month's bills,
         plinth = committed; overdue money is a crimson stain at the surface; red mark on Actions
  v0.25  cash model: liquid = cash available after commitments; 30-day cover line; plinth shows
         Available / Due this week / Projected finish; Dot's one-line brief; drawdowns in
  v0.24  serious pass: Dot is a plain orb (eyes only while speaking); schedule line on the glass;
         liquid cools when behind or overdue; sync/source line; $500k-scale data; calmer motion
  v0.23  version tag; gradual gravity flip (liquid falls, interface re-emerges)
  v0.22  mobile perf: no canvas blur, 1.5x DPR, coarser surface sampling
  v0.21  number shrinks to fit above the water; tighter header
  v0.20  tilt capped at 12° (tighter on wide screens); flat committed plinth
  v0.19  Dot always visible, floats at the surface, bounded forces
  v0.18  desktop scale unit; swipe speed sets pour speed; Dot reaches the walls
  v0.17  powder transition into Invoices; Dot reacts to tilt
  v0.16  digits climb with the number; smoother pour; single spill pool
  v0.15  number rides the wave; tip direction changes
  v0.14  Invoices spill page; 3D stage
  v0.13  number drawn in canvas, submerged rendering
  v0.12  liquidity inversion: liquid = remaining, committed layer
  v0.11  sideways pour between productions; Take Action sheet
  v0.10  first two productions, swipe
  v0.1   initial liquid dashboard
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Cost. — Liquid Budget v0.23</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FAF5EA; --cream2:#F4EBDB; --ink:#161310; --dot:#F2A24A;
  --gold-ink:#8C6A35; --panel:#2A2724;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--cream);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  touch-action:none;overscroll-behavior:none}
body{font-family:"Inter",-apple-system,system-ui,sans-serif;color:var(--ink);
  background:radial-gradient(120% 90% at 50% 0%,#FDF9F1 0%,var(--cream) 55%,var(--cream2) 100%)}

/* stage + scene for 3-D flip */
#scene{position:absolute;inset:0;transition:opacity 1.4s ease .7s,filter 1.6s ease .3s}
#scene.laid{opacity:0;filter:blur(14px)}
canvas#liquid{position:absolute;inset:0;width:100%;height:100%;display:block}

/* UI layer */
#ui{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;will-change:transform}
#ui > *{pointer-events:auto}
#overlay{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;will-change:transform}
#overlay > *{pointer-events:auto}

/* header */
.brand{position:absolute;left:24px;top:calc(18px + env(safe-area-inset-top));
  font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:42px;letter-spacing:-.02em;
  line-height:1;color:var(--ink);pointer-events:none}
.brand b{color:var(--dot);font-weight:500}
.prod{position:absolute;left:26px;top:calc(70px + env(safe-area-inset-top));font-size:13px;letter-spacing:.14em;
  text-transform:uppercase;color:#9A8A70;pointer-events:none}
.brief{position:absolute;left:26px;right:80px;top:calc(96px + env(safe-area-inset-top));
  font-size:13px;line-height:1.6;color:#3A2A10;max-width:440px;pointer-events:none;font-weight:400}

/* pager dots */
.pager{position:absolute;left:0;right:0;top:calc(30px + env(safe-area-inset-top));
  display:flex;justify-content:center;gap:7px;pointer-events:none}
.pager i{width:5px;height:5px;border-radius:50%;background:#C9B48F;opacity:.5;transition:all .3s}
.pager i.on{background:var(--dot);opacity:1;width:16px;border-radius:3px}

/* action button */
.act{position:absolute;right:20px;top:calc(16px + env(safe-area-inset-top));width:44px;height:44px;border-radius:50%;
  border:2px solid #F2A24A;background:#161310;box-shadow:0 10px 26px rgba(40,25,5,.35);
  display:grid;place-items:center;cursor:pointer;transition:transform .25s cubic-bezier(.2,.8,.2,1);z-index:5}
.act:active{transform:scale(.92)}
.act.owed::after{content:"";position:absolute;top:-2px;right:-2px;width:10px;height:10px;
  border-radius:50%;background:#8A3048;box-shadow:0 0 0 2px var(--cream)}
.act.open{background:#F2A24A}
.act svg{width:22px;height:22px;stroke:#F2A24A;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .3s}
.act.open svg{stroke:#161310;transform:rotate(45deg)}
.act:focus-visible{outline:2px solid var(--dot);outline-offset:3px}

/* actions menu */
.menu{position:absolute;right:20px;top:calc(72px + env(safe-area-inset-top));width:236px;z-index:6;
  background:var(--panel);color:#F6EEDF;border-radius:20px;padding:6px 0;
  box-shadow:0 24px 60px rgba(40,25,5,.4),0 0 0 1px rgba(255,255,255,.06);
  opacity:0;transform:translateY(-8px) scale(.96);transform-origin:top right;
  transition:opacity .22s ease,transform .28s cubic-bezier(.2,.8,.2,1);visibility:hidden}
.menu.open{opacity:1;transform:none;visibility:visible}
.menu::before{content:"";position:absolute;top:-6px;right:20px;width:12px;height:12px;background:var(--panel);transform:rotate(45deg);border-radius:2px}
.menu button{display:flex;align-items:center;gap:14px;width:100%;padding:14px 20px;border:0;background:none;color:inherit;text-align:left;cursor:pointer;font:inherit}
.menu button + button{border-top:1px solid rgba(255,255,255,.08)}
.menu button:active{background:rgba(255,255,255,.05)}
.menu svg{width:20px;height:20px;stroke:#E6D9C2;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu strong{display:block;font-weight:500;font-size:15px;letter-spacing:-.01em}
.menu strong.hot{color:#F0B25F}
.menu span{display:block;font-size:12.5px;color:#A79C89;margin-top:2px}

/* plinth — priority hierarchy */
.figs{position:absolute;left:0;right:0;bottom:0;
  padding:14px 22px 38px;pointer-events:none;display:flex;flex-direction:column}
#dueLbl{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);
  white-space:nowrap;font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,240,210,.9);pointer-events:none;opacity:0;transition:opacity .4s;
  background:rgba(50,26,6,.55);padding:4px 12px;border-radius:4px;z-index:3;
  font-family:Inter,system-ui,sans-serif;font-weight:500}
#dueLbl.show{opacity:1}
.figs .urgent-lbl{font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(255,240,210,.72);margin-bottom:4px;transition:color .6s}
.figs .urgent-lbl.alarm{color:#FFFFFF;letter-spacing:.28em;font-weight:500}
.figs .urgent-val{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;
  font-size:44px;letter-spacing:-.02em;line-height:1.05;color:#FFF8EC;
  white-space:nowrap;transition:color .6s}
.figs .urgent-val.alarm{color:#F0C0B8}
.figs .urgent-sub{font-size:11px;color:rgba(255,240,210,.65);margin-top:3px}
.figs .support{display:flex;margin-top:12px;padding-top:10px;border-top:1px solid rgba(255,255,255,.09)}
.figs .scol{flex:1;display:flex;flex-direction:column;gap:3px}
.figs .scol+.scol{border-left:1px solid rgba(255,255,255,.07);padding-left:14px}
.figs .scol label{font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,240,210,.5)}
.figs .scol strong{font-family:"Cormorant Garamond",Georgia,serif;font-size:20px;
  font-weight:500;color:#FFF8EC;white-space:nowrap}
.figs .txt-over{color:#F5957A} .figs .txt-ok{color:#9ADBA0}
.figs .verdict{font-size:9px;color:rgba(255,240,210,.42);margin-top:9px;
  display:flex;justify-content:space-between}
.figs .verdict b{font-weight:500;color:rgba(255,240,210,.65)}

/* bottom meta bar */
.meta{position:absolute;left:22px;right:22px;bottom:12px;font-size:9px;
  color:rgba(255,235,205,.4);pointer-events:none;display:flex;justify-content:space-between}
.meta b{font-weight:500;color:rgba(255,235,205,.62)}

/* speech bubble */
.say{position:absolute;left:50%;bottom:calc(104px + env(safe-area-inset-bottom));
  transform:translate(-50%,6px);max-width:78%;padding:11px 16px;border-radius:16px;
  background:rgba(255,250,240,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  color:#3A2A12;font-size:13.5px;line-height:1.4;text-align:center;
  box-shadow:0 10px 30px rgba(90,55,10,.15);opacity:0;
  transition:opacity .3s,transform .4s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.say.on{opacity:1;transform:translate(-50%,0)}

/* transitions */
.fade{transition:opacity .25s}.fade.out{opacity:0}
.slide{transition:opacity .6s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
#ui.flipping > *{opacity:0 !important;pointer-events:none;transition:opacity .35s ease}
#ui.emerging > *{transition:opacity 1.1s ease,transform 1.1s cubic-bezier(.2,.7,.2,1)}

/* version badge */
.ver{position:absolute;right:22px;bottom:calc(2px + env(safe-area-inset-bottom));
  font-size:9px;letter-spacing:.12em;color:rgba(255,235,205,.38);pointer-events:none;
  font-family:ui-monospace,Menlo,monospace}

/* permission prompt */
.perm{position:fixed;left:50%;bottom:calc(26% + env(safe-area-inset-bottom));transform:translateX(-50%);
  padding:12px 22px;border-radius:999px;border:1px solid rgba(140,106,53,.35);
  background:rgba(255,250,240,.9);color:var(--gold-ink);font:500 13px/1 "Inter",sans-serif;
  letter-spacing:.06em;cursor:pointer;box-shadow:0 10px 30px rgba(90,55,10,.12);z-index:20;display:none}
.perm.show{display:block}

/* sheets (Take Action + Invoices) */
.sheet{position:absolute;inset:0;background:rgba(250,245,234,.92);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
  transform:translateY(100%);transition:transform .5s cubic-bezier(.2,.8,.2,1);
  display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top)) 22px calc(20px + env(safe-area-inset-bottom));
  touch-action:pan-y}
.sheet{visibility:hidden;transition:transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s linear .5s}
.sheet.open{transform:none;visibility:visible;transition:transform .5s cubic-bezier(.2,.8,.2,1),visibility 0s}
.sheet header{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.sheet header button{width:40px;height:40px;border-radius:50%;border:0;
  background:#FFF9EF;box-shadow:0 6px 18px rgba(120,80,20,.12);font-size:18px;
  color:var(--gold-ink);cursor:pointer}
.sheet h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:34px;
  letter-spacing:-.02em;line-height:1}
.sheet h2 b{color:var(--dot);font-weight:500}
.sheet .sub{font-size:12px;color:#9A8A70;letter-spacing:.06em;margin-top:6px}
.sheet .list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch;padding-bottom:20px}
.item{display:flex;gap:14px;align-items:flex-start;padding:16px 0;
  border-bottom:1px solid rgba(140,106,53,.16)}
.item .d{width:10px;height:10px;border-radius:50%;margin-top:6px;flex:none;background:var(--dot)}
.item .d.late{background:#C8462B}.item .d.soft{background:#C9B48F}
.item .t{flex:1}
.item strong{display:block;font-weight:500;font-size:15px;letter-spacing:-.01em}
.item span{display:block;font-size:12.5px;color:#8A7A60;margin-top:3px;line-height:1.4}
.item em{font-style:normal;font-family:"Cormorant Garamond",Georgia,serif;
  font-size:20px;font-weight:500;white-space:nowrap}
.item .chips{display:flex;gap:6px;margin-top:10px}
.chip{padding:6px 12px;border-radius:999px;font-size:11.5px;font-weight:500;
  border:1px solid rgba(140,106,53,.3);background:transparent;color:var(--gold-ink);
  cursor:pointer;font-family:inherit}
.chip.primary{background:var(--ink);color:#FAF5EA;border-color:var(--ink)}
.item.done{opacity:.35;transition:opacity .4s}
.sheet .empty{text-align:center;color:#9A8A70;font-size:13px;padding:40px 0}

/* paper (invoices) */
.paper{background:var(--cream);backdrop-filter:none;-webkit-backdrop-filter:none;overflow:hidden;
  transform:none;opacity:0;visibility:hidden;
  transition:opacity .6s ease,visibility 0s linear .6s;
  box-shadow:0 40px 80px rgba(60,35,5,.18)}
.paper.open{opacity:1;visibility:visible;transition:opacity 1.2s ease,visibility 0s}
canvas.puddle{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.paper header,.paper .inv,.paper .empty{opacity:0;filter:blur(10px);transform:scale(1.03);position:relative}
.paper.open header,.paper.open .inv,.paper.open .empty{animation:emerge 1.1s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes emerge{to{opacity:1;filter:blur(0);transform:none}}
.inv{display:flex;align-items:center;gap:14px;padding:16px 0;border-bottom:1px solid rgba(140,106,53,.14)}
.inv .t{flex:1}
.inv strong{display:block;font-weight:500;font-size:15px}
.inv span{display:block;font-size:12px;color:#8A7A60;margin-top:3px}
.inv em{font-style:normal;font-family:"Cormorant Garamond",Georgia,serif;font-size:21px;font-weight:500}
.inv .st{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-ink);margin-top:4px}
.inv.late .st{color:#C8462B}.inv.paid{opacity:.5}

/* dev overlay */
#dev{position:fixed;left:12px;bottom:12px;z-index:30;display:none;
  background:rgba(20,18,15,.82);color:#EADFCB;border-radius:14px;padding:10px;font-size:11px;
  backdrop-filter:blur(8px);width:190px;font-family:ui-monospace,Menlo,monospace}
#dev.show{display:block}
#dev .row{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
#dev button{flex:1;padding:6px 4px;border:0;border-radius:8px;background:#3A352E;color:inherit;font:inherit;cursor:pointer}
#dev button:hover{background:#4A4238}
#dev .pad{position:relative;height:110px;border-radius:10px;background:#2A2723;cursor:crosshair;overflow:hidden}
#dev .pad i{position:absolute;width:12px;height:12px;border-radius:50%;background:var(--dot);left:50%;top:50%;transform:translate(-50%,-50%)}
#dev .pad::before,#dev .pad::after{content:"";position:absolute;background:#3D3730}
#dev .pad::before{left:50%;top:0;bottom:0;width:1px}#dev .pad::after{top:50%;left:0;right:0;height:1px}
#dev p{opacity:.6;margin-top:6px;line-height:1.5}

/* cost report screen */
.report-wrap{position:fixed;inset:0;overflow-y:auto;background:#FAF5EA;
  transform:translateY(100%);transition:transform .8s cubic-bezier(.2,.7,.15,1);z-index:40;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.report-wrap.open{transform:none}
.report-head{position:sticky;top:0;z-index:2;background:rgba(94,51,11,.9);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:calc(14px + env(safe-area-inset-top)) 22px 12px;
  border-bottom:1px solid rgba(255,235,200,.12);display:flex;align-items:center;gap:14px}
.report-head button{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,235,200,.25);
  background:rgba(255,240,210,.08);color:#F2A24A;font-size:13px;letter-spacing:.06em;cursor:pointer;
  flex:none;display:grid;place-items:center;font-family:Inter,system-ui,sans-serif}
.report-head h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:400;font-size:26px;
  letter-spacing:-.01em;flex:1;color:#FFF4E0}
.report-head h2 b{color:var(--dot)}
.rep-kpi{display:flex;gap:0;border-bottom:1px solid rgba(255,235,200,.12);background:rgba(0,0,0,.14)}
.rep-kpi div{flex:1;padding:14px 18px;border-right:1px solid rgba(255,235,200,.1)}
.rep-kpi div:last-child{border-right:0}
.rep-kpi label{display:block;font-size:8px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,235,200,.55);margin-bottom:5px}
.rep-kpi strong{font-family:"Cormorant Garamond",Georgia,serif;font-size:22px;font-weight:500;color:#FFF4E0;display:block}
.rep-kpi strong.neg{color:#F5B8B0} .rep-kpi strong.pos{color:#B8E8C4}
.rep-cat{padding:18px 22px 6px;font-size:9px;letter-spacing:.22em;text-transform:uppercase;
  color:rgba(242,162,74,.85);border-bottom:1px solid rgba(255,235,200,.1);margin-top:4px}
.rep-row{display:flex;align-items:center;padding:12px 22px;border-bottom:1px solid rgba(255,235,200,.07);gap:10px}
.rep-row .rn{flex:1;min-width:0}
.rep-row .rn strong{display:block;font-size:13.5px;font-weight:500;color:#FFF4E0}
.rep-row .rn span{display:block;font-size:11px;color:rgba(255,235,200,.5);margin-top:1px}
.rep-row .rv{font-family:"Cormorant Garamond",Georgia,serif;font-size:16px;font-weight:500;width:72px;text-align:right;white-space:nowrap}
.rep-row .rv.budget{color:rgba(255,230,190,.5)}
.rep-row .rv.actual{color:#FFF4E0}
.rep-var{font-size:11px;font-weight:500;padding:3px 7px;border-radius:99px;white-space:nowrap}
.rep-var.neg{background:rgba(240,160,160,.16);color:#F5B8B0}
.rep-var.pos{background:rgba(150,220,170,.16);color:#B8E8C4}
.rep-var.zero{background:rgba(255,255,255,.07);color:rgba(255,235,200,.55)}
/* chevron in the liquid surface */
.chev{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 4px);left:50%;
  transform:translateX(-50%);pointer-events:auto;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:2px;opacity:0;
  animation:chevpulse 3s ease-in-out 2s infinite}
.chev svg{width:20px;height:20px;stroke:rgba(255,240,200,.7);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@keyframes chevpulse{0%,100%{opacity:0;transform:translateX(-50%) translateY(3px)}40%,60%{opacity:1;transform:translateX(-50%) translateY(0)}}
@media(min-width:900px){
  .brand{font-size:36px} .prod{font-size:11px} .brief{font-size:13px}
  .figs .urgent-val{font-size:52px} .figs{padding:16px 28px 44px}
  .figs .scol strong{font-size:22px}
}

/* ===== page layout: liquid screen on top, cost report below, one scroll ===== */
.scroll-page{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;background:#2C1604;
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:none;
  display:flex;flex-direction:column}
.scroll-page::-webkit-scrollbar{display:none}
.liquid-pane{position:relative;height:100vh;height:100dvh;min-height:100vh;
  flex:0 0 auto;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#FDF9F1 0%,#FAF5EA 55%,#F4EBDB 100%)}
.report-pane{position:relative;min-height:100vh;flex:0 0 auto;z-index:1;color:#FFF4E0;padding-bottom:40px;
  background:linear-gradient(180deg,#5E330B 0%,#4A2708 30%,#3A1E06 70%,#2C1604 100%)}
#stage{position:absolute;inset:0;overflow:hidden;perspective:900px;perspective-origin:50% 30%}
</style>
</head>
<body>
<div class="scroll-page" id="scrollPage">
<div class="liquid-pane" id="liquidPane">
<div id="stage" style="position:absolute;inset:0;overflow:hidden"><div id="scene">
<canvas id="liquid"></canvas>

<div id="ui">
  <div class="brand">Cost<b>.</b></div>
  <div class="prod fade" id="prod"></div>
  <div class="brief fade" id="brief"></div>
  <div class="pager" id="pager"></div>

let cur = 0;                                   // active production index

function prodOf(i){

function showProduction(i, instant){

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------- Assistant hook (swap for the real Cost. AI) -------------- */
const Assistant = {

/* ---------------- Canvas + geometry ---------------- */
const cv = document.getElementById('liquid'), ctx = cv.getContext('2d');
let W=0, H=0, DPR=1, U=1;                       // U = layout unit, capped so desktop stays calm
function resize(){
  DPR = Math.min(matchMedia('(pointer:coarse)').matches?1.5:2, devicePixelRatio||1);
  W = innerWidth; H = innerHeight; U = Math.min(Math.min(W,H), 440);
  cv.width = W*DPR; cv.height = H*DPR; ctx.setTransform(DPR,0,0,DPR,0,0);
}

/* gravity direction in screen coords (unit vector), target from sensors */
const grav = { x:0, y:1 };          // target
const S = {                          // smoothed state
  theta: 0, omega: 0,                // container angle in gravity frame + angular velocity
  slosh: 0, sloshV: 0,               // surface tilt (spring)
  amp: 0, phase: 0,                  // travelling wave amplitude
  t: 0
};
// theta such that rotating (0,1) by theta gives gravity: theta = atan2(-gx, gy)
const angleOf = g => Math.atan2(-g.x, g.y);
const hex2=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function mix(a,b,t){ const A=hex2(a),B=hex2(b); return `rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')})`; }
const MAX_TILT_DEG = 12;               // how far the surface may lean from the interface's down
const maxTilt = () => Math.min(MAX_TILT_DEG*Math.PI/180, Math.atan(0.14*H/W));   // never more than ~14% rise across the width
const wrap = a => Math.atan2(Math.sin(a), Math.cos(a));

/* liquid surface height along gravity for a given container angle: area-conserving.
   Rectangle W×H is rotated into the gravity frame; find sy so that area{y>=sy} = FILL*W*H */
function rectInFrame(theta){
  const c=Math.cos(theta), s=Math.sin(theta), hw=W/2, hh=H/2;
  // frame = R(-theta) * screen
  return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]].map(([x,y])=>[ x*c + y*s, -x*s + y*c ]);
}
function areaBelow(poly, sy){
  const out=[];
  for(let i=0;i<poly.length;i++){
    const a=poly[i], b=poly[(i+1)%poly.length];
    const ina=a[1]>=sy, inb=b[1]>=sy;
    if(ina) out.push(a);
    if(ina!==inb){ const t=(sy-a[1])/(b[1]-a[1]); out.push([a[0]+(b[0]-a[0])*t, sy]); }
  }
  let A=0; for(let i=0;i<out.length;i++){ const p=out[i], q=out[(i+1)%out.length]; A+=p[0]*q[1]-q[0]*p[1]; }
  return Math.abs(A)/2;
}
function surfaceLevel(theta, fill=FILL){
  const poly=rectInFrame(theta), target=fill*W*H, R=Math.hypot(W,H)/2;
  let lo=-R, hi=R;
  for(let i=0;i<28;i++){ const m=(lo+hi)/2; (areaBelow(poly,m)>target)?lo=m:hi=m; }
  return (lo+hi)/2;
}

/* wave shape in frame coordinates */
const motionScale = REDUCED ? 0.25 : 1;
let pourSy2=0, pourBx=0, pourDir=1;
const smooth=t=>{t=Math.max(0,Math.min(1,t)); return t*t*(3-2*t)};
const ease5=t=>{t=Math.max(0,Math.min(1,t)); return t<.5?16*t*t*t*t*t:1-Math.pow(-2*t+2,5)/2};
function surfaceY(x, sy){
  if(pour.on){
    // new level takes over on the side the swipe came from and sweeps across, with a crest at the front
    const k=smooth((x-pourBx)*pourDir/240+0.5);
    const crest=Math.exp(-Math.pow((x-pourBx)/120,2))*Math.abs(pourSy2-sy)*0.22*Math.sin(Math.PI*pour.p);
    sy = sy + (pourSy2-sy)*k - crest*motionScale;
  }
  return sy + S.slosh*x
    + S.amp*Math.sin(x*0.022 + S.phase)*motionScale
    + 2.2*motionScale*Math.sin(x*0.013 + S.t*1.1) + 1.2*motionScale*Math.sin(x*0.031 - S.t*0.7);
}

/* ---------------- Dot (the assistant) ---------------- */
const dot = { x:W/2, y:H*0.72, vx:0, vy:0, r:U*0.06, squash:1, squashV:0, blink:0, face:0, faceUntil:0 };

function spawnBubble(deep){ return { x:(Math.random()-.5)*Math.max(W,H), y:deep?Math.random()*H*0.6+H*0.2:0, r:0.8+Math.random()*2.2, v:8+Math.random()*16, w:Math.random()*6.28 }; }

/* ---------------- Interface layer ---------------- */
const ui = document.getElementById('ui'), overlay=document.getElementById('overlay'), scene=document.getElementById('scene');
let uiSnap = 0, uiAngle = 0;                      // radians (multiples of PI/2)
const flip = { on:false, t:0, to:0 };             // the slow inversion: liquid falls first, interface re-emerges after
let uiFade = 1;                                    // alpha for the canvas-drawn interface bits (number, plinth)
function layoutUI(snap){

/* ---------------- Main loop ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now; S.t+=dt;

  // smooth container angle toward gravity (shortest path), tilt capped so it stays water-like, not a landslide
  const rawTarget=angleOf(grav);
  const rel=wrap(rawTarget-uiSnap);
  const MT=maxTilt(); const target=uiSnap + Math.max(-MT, Math.min(MT, rel));
  const prev=S.theta;
  const diff=wrap(target-S.theta);
  S.theta += diff*Math.min(1, dt*(flip.on?2.0:9));
  const omega = wrap(S.theta-prev)/dt;
  S.omega += (omega-S.omega)*Math.min(1,dt*12);

  // slosh spring driven by rotation speed
  const k=38, c=5.5;
  S.sloshV += (-k*S.slosh - c*S.sloshV - S.omega*0.55)*dt;
  S.slosh  += S.sloshV*dt;
  S.slosh   = Math.max(-0.45, Math.min(0.45, S.slosh));
  if(flip.on){ S.slosh*=0.985; S.amp=Math.min(S.amp, 14); }   // keep the fall heavy, not frantic
  // travelling wave amplitude excited by motion, decays
  S.amp += Math.abs(S.omega)*40*dt;
  S.amp *= Math.exp(-dt*1.6); S.amp=Math.min(S.amp, 26);
  S.phase += dt*(3 + Math.abs(S.omega));

  // sideways pour between productions
  DRAIN += (drainTarget-DRAIN)*Math.min(1,dt*(drainTarget>DRAIN?1.1:1.6));
  const keep = 1-DRAIN;
  let shownFill = FILL;
  if(pour.on){
    pour.p = Math.max(0, Math.min(1, pour.p + pour.rate*dt));
    pourText();
    const e=REDUCED?1:ease5(pour.p);                             // slow in, slow out — the front glides
    const R0=Math.hypot(W,H)/2+60;
    pourDir = pour.dir; pourBx = pour.dir*R0*(1-2*e);      // front sweeps from the incoming edge across
    pourSy2 = surfaceLevel(S.theta, pour.to*keep);
    shownFill = pour.from + (pour.to-pour.from)*e;
    if(pour.p>=1) finishPour();
    else if(pour.p<=0) cancelPour();
  }else if(FILL!==fillTarget){ FILL=fillTarget; }
  COMMIT += (commitTarget-COMMIT)*Math.min(1,dt*1.2);
  MOOD += (moodTarget-MOOD)*Math.min(1,dt*0.8);
  if(coverTarget!=null){ COVER = COVER==null? coverTarget : COVER + (coverTarget-COVER)*Math.min(1,dt*1.5); }
  // numShown is driven by the number's position (see below)
  const sy = surfaceLevel(S.theta, (pour.on?pour.from:FILL)*keep + 0.012*DRAIN);
  const cs=Math.cos(S.theta), sn=Math.sin(S.theta);
  const toFrame=(x,y)=>{ x-=W/2; y-=H/2; return [x*cs+y*sn, -x*sn+y*cs]; };
  const toScreen=(fx,fy)=>[ fx*cs - fy*sn + W/2, fx*sn + fy*cs + H/2 ];

  /* Dot physics in gravity frame */
  {
    let [fx,fy]=toFrame(dot.x,dot.y);
    let [vx,vy]=[dot.vx*cs+dot.vy*sn, -dot.vx*sn+dot.vy*cs];
    const surf = surfaceY(fx,sy);
    const rest = surf + dot.r*1.3 + (dot.sink||0);       // floats with its crown just breaking the surface
    const under = Math.max(-dot.r*6, Math.min(dot.r*6, fy - rest));   // a big level jump is a bounded force, not a launch
    const buoy = -under*(REDUCED?18:14);
    vy += (buoy - vy*4.2)*dt;
    if(fy < surf + dot.r*0.6){ vy += (surf + dot.r*0.6 - fy)*60*dt; vy*=0.9; }   // can't leave the water: gravity + surface tension above the line
    const lean = grav.x*cs + grav.y*sn;                  // how far the raw tilt is ahead of the smoothed frame
    vx += (S.slosh*-260 + S.omega*-220 + lean*700 - vx*1.3 - fx*0.04)*dt;    // a strong tilt pins him against the low wall   // carried by the slosh, thrown by rotation, drifts with the tilt
    if(!REDUCED) vy += Math.sin(S.t*1.1)*3*dt;          // barely-there bob
    const vmax=U*2.2; vx=Math.max(-vmax,Math.min(vmax,vx)); vy=Math.max(-vmax,Math.min(vmax,vy));
    fx += vx*dt; fy += vy*dt;
    [dot.x,dot.y]=toScreen(fx,fy);
    dot.vx = vx*cs - vy*sn; dot.vy = vx*sn + vy*cs;
    // keep inside the glass
    const m=dot.r+4;
    if(dot.x<m){dot.x=m; dot.vx=Math.abs(dot.vx)*0.25} if(dot.x>W-m){dot.x=W-m; dot.vx=-Math.abs(dot.vx)*0.25}
    if(dot.y<m){dot.y=m; dot.vy=Math.abs(dot.vy)*0.25} if(dot.y>H-m){dot.y=H-m; dot.vy=-Math.abs(dot.vy)*0.25}
    // squash spring
    dot.squashV += (-(dot.squash-1)*220 - dot.squashV*10)*dt; dot.squash += dot.squashV*dt;
    dot.blink = Math.max(0, dot.blink - dt);
    if(dot.face>0.5 && Math.random()<dt*0.18 && !REDUCED) dot.blink=0.14;
    const wantFace = performance.now()<dot.faceUntil ? 1 : 0;
    dot.face += (wantFace-dot.face)*Math.min(1,dt*(wantFace?6:2));
    // when liquidity is thin, it sits lower in the water
    dot.sink = MOOD*dot.r*0.5;
  }

  /* ---------- draw ---------- */
  ctx.clearRect(0,0,W,H);
  /* ---------- the number: a buoyant object in the interface frame ---------- */
  {
    const uiH = parseFloat(ui.style.height)||H;
    // sample the real surface (pour front, slosh and ripple included) directly under the number
    const [nsx,nsy] = [W/2 - Math.sin(uiAngle)*num.y, H/2 + Math.cos(uiAngle)*num.y];
    const [nfx,nfy] = toFrame(nsx,nsy);
    const surfF = surfaceY(nfx + (pour.on?pourDir*70:0), sy);         // sample a little behind the crest so it rises only once the wave is under it
    const [ssx,ssy] = toScreen(nfx,surfF);
    const surfUI = -(ssx-W/2)*Math.sin(uiAngle) + (ssy-H/2)*Math.cos(uiAngle);   // ...as a y in the interface frame
    // rest just above the surface, but never up into the header — when the glass is very full the number sits in the liquid instead
    const headerBottom = -uiH/2 + 188;                                  // below the wordmark, episode label and brief
    const wantBase = surfUI - U*0.06;                                    // baseline just above the surface
    const fit = (wantBase - headerBottom - 18)/0.86;                     // biggest number that still clears the header
    const targetSize = Math.max(46, Math.min(U*0.27, fit));
    if(!num.size) num.size=targetSize; else num.size += (targetSize-num.size)*Math.min(1,dt*6);
    const nSize = Math.round(num.size);
    const restY = Math.max(headerBottom + nSize*0.86 + 18, wantBase);
    num.vy += ((restY - num.y)*(REDUCED?40:26) - num.vy*(REDUCED?14:7))*dt;   // stiff enough to ride the crest, soft enough to lag a touch
    num.y  += num.vy*dt;
    const wave = 0, bob = 0;
    // the digits only change once the front has actually reached them
    if(pour.on || pourTail>0){
      const derived = Math.max(0, Math.min(1, 0.5 - (num.y+U*0.06)/uiH));   // level implied by where the number sits
      numShown += (derived - numShown)*Math.min(1, dt*10);
      if(!pour.on) pourTail -= dt;
    } else numShown += (fillTarget*keep - numShown)*Math.min(1, dt*4);
    const fontN = `300 ${nSize}px "Cormorant Garamond", Georgia, serif`;
    const fontS = `300 ${Math.round(nSize*0.36)}px "Cormorant Garamond", Georgia, serif`;
    const fontE = `500 ${U>400?11:10}px Inter, system-ui, sans-serif`;
    drawNum=(fill, blur)=>{
      ctx.save();
      ctx.translate(W/2,H/2); ctx.rotate(uiAngle);
      ctx.translate(0, num.y + wave*bob*motionScale);
      // (no ctx.filter blur: it tanks frame rate on phones)
      ctx.fillStyle=fill; ctx.textBaseline='alphabetic';
      const txt=String(Math.round(numShown*100));
      ctx.font=fontN; const wN=ctx.measureText(txt).width;
      ctx.font=fontS; const wS=ctx.measureText('%').width+8;
      const x0=-(wN+wS)/2;
      ctx.font=fontN; ctx.textAlign='left'; ctx.fillText(txt, x0, 0);
      ctx.font=fontS; ctx.fillText('%', x0+wN+8, 0);
      ctx.font=fontE; ctx.textAlign='center';
      const eb='B U D G E T   R E M A I N I N G';
      const ey=-nSize*0.86;
      ctx.fillText(eb, 0, ey);
      ctx.fillRect(-ctx.measureText(eb).width/2-22, ey-4, 3, 3); ctx.fillRect(ctx.measureText(eb).width/2+19, ey-4, 3, 3);
      ctx.restore();
    };
    if(uiFade>0){ ctx.save(); ctx.globalAlpha=uiFade; drawNum('rgba(140,106,53,0.95)', 0); ctx.restore(); }   // ink: drawn first so the liquid genuinely covers it
  }
  ctx.save();
  ctx.translate(W/2,H/2); ctx.rotate(S.theta);
  const R=Math.hypot(W,H)/2+40;

  // liquid body (kept as a Path2D so the number can be clipped by it)
  const liquidPath=new Path2D();
  liquidPath.moveTo(-R, surfaceY(-R,sy));
  for(let x=-R+12;x<=R;x+=12) liquidPath.lineTo(x, surfaceY(x,sy));
  liquidPath.lineTo(R,R); liquidPath.lineTo(-R,R); liquidPath.closePath();
  ctx.beginPath(); ctx.moveTo(-R, surfaceY(-R,sy));
  for(let x=-R+12;x<=R;x+=12) ctx.lineTo(x, surfaceY(x,sy));
  ctx.lineTo(R,R); ctx.lineTo(-R,R); ctx.closePath();
  const depth=Math.hypot(W,H);
  const g=ctx.createLinearGradient(0,sy,0,sy+depth*0.8);
  // bright translucent honey-gold — reference image palette
  g.addColorStop(0,   mix('#FBDA8C','#EEC878',MOOD));
  g.addColorStop(0.12,mix('#F2BE52','#DCA84C',MOOD));
  g.addColorStop(0.35,mix('#E09A28','#CC8A30',MOOD));
  g.addColorStop(0.58,mix('#CC7A18','#B06A28',MOOD));
  g.addColorStop(0.80,mix('#AE5C14','#985030',MOOD));
  g.addColorStop(1,   mix('#8C4210','#784030',MOOD));
  ctx.fillStyle=g; ctx.fill();
  ctx.save(); ctx.clip();

  // depth vignette on the sides
  const vg=ctx.createLinearGradient(-R,0,R,0);
  vg.addColorStop(0,'rgba(70,30,0,0.28)'); vg.addColorStop(0.3,'rgba(70,30,0,0)'); vg.addColorStop(0.7,'rgba(70,30,0,0)'); vg.addColorStop(1,'rgba(70,30,0,0.28)');
  ctx.fillStyle=vg; ctx.fillRect(-R,-R,2*R,2*R);

  // bubbles (rise against gravity)
  ctx.fillStyle='rgba(255,244,210,0.28)'; ctx.strokeStyle='rgba(255,250,230,0.55)'; ctx.lineWidth=0.8;
  for(const b of bubbles){
    if(!REDUCED){ b.y -= b.v*dt; b.x += Math.sin(S.t*1.5+b.w)*6*dt; }
    if(b.y < surfaceY(b.x,sy)+3){ Object.assign(b, spawnBubble(false)); b.y = sy + depth*0.55 + Math.random()*depth*0.2; }
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,6.283); ctx.fill(); ctx.stroke();
  }

  // surface highlight / meniscus
  ctx.beginPath(); ctx.moveTo(-R,surfaceY(-R,sy));
  for(let x=-R+12;x<=R;x+=12) ctx.lineTo(x,surfaceY(x,sy));
  ctx.strokeStyle='rgba(255,246,222,0.85)'; ctx.lineWidth=2.2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-R,surfaceY(-R,sy)+5);
  for(let x=-R+12;x<=R;x+=12) ctx.lineTo(x,surfaceY(x,sy)+5+Math.sin(x*0.05+S.t)*1.2);
  ctx.strokeStyle='rgba(255,230,170,0.35)'; ctx.lineWidth=6; ctx.stroke();
  ctx.restore(); // clip

  // soft glow above the surface
  ctx.beginPath(); ctx.moveTo(-R,surfaceY(-R,sy));
  for(let x=-R+12;x<=R;x+=12) ctx.lineTo(x,surfaceY(x,sy));
  ctx.strokeStyle='rgba(250,200,90,0.18)'; ctx.lineWidth=16; ctx.stroke();
  ctx.restore();

  // committed zone: cooler bronze liquid below the meniscus — a different substance
  if(COVER!=null && DRAIN<0.98 && COVER*keep>0.005){
    const cy = surfaceLevel(S.theta, COVER*keep);
    const soft=U*0.04;                                        // tight fade — we want a crisp boundary
    ctx.save(); ctx.translate(W/2,H/2); ctx.rotate(S.theta); ctx.clip(liquidPath);

    // the bronze fill: a clearly cooler, more opaque tone
    ctx.beginPath(); ctx.moveTo(-R, cy+soft);
    for(let x=-R+12;x<=R;x+=12) ctx.lineTo(x, cy+soft + S.slosh*x*0.3 + 0.8*Math.sin(x*0.014+S.t*0.4));
    ctx.lineTo(R,R+4); ctx.lineTo(-R,R+4); ctx.closePath();
    const bg=ctx.createLinearGradient(0,cy,0,cy+depth*0.6);
    bg.addColorStop(0,'rgba(140,88,22,0.70)');   // warm lighter bronze
    bg.addColorStop(0.3,'rgba(112,66,14,0.80)');
    bg.addColorStop(1,'rgba(78,42,8,0.90)');
    ctx.fillStyle=bg; ctx.fill();

    // depth texture: faint horizontal bands like looking through dense liquid
    for(let i=0;i<5;i++){
      const ty=cy+soft + (depth*0.55)*(i/5) + Math.sin(S.t*0.4+i)*4;
      ctx.beginPath(); ctx.moveTo(-R,ty); ctx.lineTo(R,ty);
      ctx.strokeStyle=`rgba(200,148,72,${0.05-i*0.008})`; ctx.lineWidth=5+i*3; ctx.stroke();
    }

    // side-vignette: committed zone is deeper, darker at edges
    const vg2=ctx.createLinearGradient(-R,0,R,0);
    vg2.addColorStop(0,'rgba(40,18,4,0.32)'); vg2.addColorStop(0.3,'rgba(40,18,4,0)'); vg2.addColorStop(0.7,'rgba(40,18,4,0)'); vg2.addColorStop(1,'rgba(40,18,4,0.32)');
    ctx.fillStyle=vg2; ctx.fillRect(-R,cy,R*2,depth);
    ctx.restore();

    // meniscus: the bright dividing line between the two substances — always visible
    ctx.save(); ctx.translate(W/2,H/2); ctx.rotate(S.theta);
    ctx.beginPath(); ctx.moveTo(-R, cy);
    for(let x=-R+12;x<=R;x+=12) ctx.lineTo(x, cy + S.slosh*x*0.3 + 0.8*Math.sin(x*0.014+S.t*0.4));
    ctx.strokeStyle='rgba(255,242,185,0.96)'; ctx.lineWidth=2.5; ctx.stroke();  // bright cream rim
    ctx.strokeStyle='rgba(255,228,150,0.28)'; ctx.lineWidth=12; ctx.stroke();
    ctx.restore();

    // label: drawn in the interface frame so it's always readable regardless of liquid level
    if(uiFade>0 && DRAIN<0.5){
      const uiH2=parseFloat(ui.style.height)||H, uiW2=parseFloat(ui.style.width)||W;
      const [lsx,lsy]=toScreen(0,cy);
      const lyUI = -(lsx-W/2)*Math.sin(uiAngle)+(lsy-H/2)*Math.cos(uiAngle);
      const labelY = Math.max(-uiH2/2+120, Math.min(uiH2/2-80, lyUI-16));
      ctx.save(); ctx.globalAlpha=uiFade*(1-DRAIN*2); ctx.translate(W/2,H/2); ctx.rotate(uiAngle);
      // pill background so the label reads over both cream AND amber
      const lbl='DUE THIS MONTH · '+fmt(prodOf(cur).due30);
      ctx.font='500 9px Inter, system-ui, sans-serif';
      const tw=ctx.measureText(lbl.split('').join(' ')).width+8;
      ctx.fillStyle='rgba(50,26,6,0.55)'; ctx.beginPath(); ctx.roundRect(-tw/2-6,labelY-10,tw+12,18,4); ctx.fill();
      ctx.fillStyle='rgba(255,230,180,0.92)'; ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(lbl.split('').join(' '), 0, labelY-1);
      ctx.restore();
    }
  }

  // overdue money: a crimson stain at the surface, sized by the amount, breathing slowly
  {
    const p=prodOf(cur);
    if(p.overdue.length && DRAIN<0.98){
      ctx.save(); ctx.translate(W/2,H/2); ctx.rotate(S.theta); ctx.clip(liquidPath);
      p.overdue.forEach((o,i)=>{
        const x = (i - (p.overdue.length-1)/2)*U*0.26 - U*0.18;
        const r = Math.max(U*0.04, U*(0.05 + 0.10*Math.min(1, Math.sqrt(o.amt/p.budget)*2)));
        const y = surfaceY(x,sy) + r*0.55;
        const breathe = 0.5 + 0.5*Math.sin(S.t*1.3 + i);
        // wine-dark meniscus disturbance — sophisticated, not a red blob
        const sg=ctx.createRadialGradient(x,y-r*0.3,Math.max(0.5,r*0.1),x,y,Math.max(1,r*(1.1+0.08*breathe)));
        sg.addColorStop(0,`rgba(90,30,42,${0.55+0.1*breathe})`); sg.addColorStop(0.5,`rgba(80,26,36,${0.28+0.08*breathe})`); sg.addColorStop(1,'rgba(70,22,30,0)');
        ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(x,y,r*1.1,0,6.283); ctx.fill();
        // thin elliptical ring at the surface — like a dark oil ring on water
        const ph=((S.t*0.28+i*0.45)%1);
        ctx.strokeStyle=`rgba(80,22,34,${(1-ph)*0.45})`; ctx.lineWidth=1.5;
        ctx.beginPath(); ctx.ellipse(x,surfaceY(x,sy),r*(0.5+ph*1.4),r*(0.12+ph*0.35),0,0,6.283); ctx.stroke();
      });
      ctx.restore();
    }
  }

  // committed funds: a flat, still plinth at the bottom of the interface — the stats always sit on level ground
  {
    const uiH = parseFloat(ui.style.height)||H, uiW = parseFloat(ui.style.width)||W;
    const bandH = Math.max(uiH*Math.max(0.18, Math.min(0.26, COMMIT*keep + 0.10)), 150)*keep;
    if(bandH>1){
      ctx.save(); ctx.globalAlpha=uiFade; ctx.translate(W/2,H/2); ctx.rotate(uiAngle);
      const top=uiH/2-bandH;
      const feather=U*0.14;
      const pg=ctx.createLinearGradient(0,top-feather,0,uiH/2);
      pg.addColorStop(0,'rgba(120,72,16,0)'); pg.addColorStop(feather/(bandH+feather),'rgba(128,72,18,0.60)'); pg.addColorStop(1,'rgba(90,50,10,0.86)');
      ctx.fillStyle=pg; ctx.fillRect(-uiW/2-2, top-feather, uiW+4, bandH+feather+2);
      ctx.restore();
    }
  }
  // Dot — drawn after the liquid so he's visible whether he's under the surface or riding on it
  const drawDot=()=>{
    const [fx,fy]=toFrame(dot.x,dot.y), r=dot.r, sq=dot.squash;
    ctx.save(); ctx.translate(fx,fy); ctx.scale(1/Math.sqrt(sq), sq);
    ctx.beginPath(); ctx.arc(0,0,r,0,6.283);
    const dg=ctx.createRadialGradient(-r*0.35,-r*0.4,r*0.1, 0,0,r*1.05);
    dg.addColorStop(0,'#FFD79A'); dg.addColorStop(0.5,'#F5A94E'); dg.addColorStop(1,'#B9651E');
    ctx.fillStyle=dg; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,r,0,6.283); ctx.strokeStyle='rgba(120,65,10,0.25)'; ctx.lineWidth=1.2; ctx.stroke();
    if(dot.face>0.01){                                    // features only while it's attending to you
      ctx.globalAlpha=dot.face; ctx.strokeStyle='#4A2C0F'; ctx.lineWidth=Math.max(1.4,r*0.06); ctx.lineCap='round';
      const ey=-r*0.05, ex=r*0.34, ew=r*0.15, open = dot.blink>0?0.15:1;
      for(const sgn of [-1,1]){ ctx.beginPath(); ctx.arc(sgn*ex, ey+ew*open*0.4, ew, Math.PI, 2*Math.PI); ctx.stroke(); }
      ctx.globalAlpha=1;
    }
    ctx.restore();
  };
  ctx.save(); ctx.translate(W/2,H/2); ctx.rotate(S.theta);
  drawDot();
  // the part of him under the surface, seen through the amber
  ctx.save(); ctx.clip(liquidPath);
  { const [fx,fy]=toFrame(dot.x,dot.y); ctx.beginPath(); ctx.arc(fx,fy,dot.r*1.02,0,6.283); ctx.fillStyle='rgba(200,120,30,0.30)'; ctx.fill(); }
  ctx.restore();
  ctx.restore();

  // below the surface: the number seen through the amber — clipped by the liquid, softened, lifted by the ripple
  ctx.save();
  ctx.translate(W/2,H/2); ctx.rotate(S.theta); ctx.clip(liquidPath);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.globalAlpha=uiFade; drawNum('rgba(255,228,180,0.42)', 0); ctx.globalAlpha=1;
  ctx.restore();


  { const dl=$('dueLbl');
    if(dl && COVER!=null && DRAIN<0.5){
      dl.textContent='DUE THIS MONTH · '+fmt(prodOf(cur).due30);
      dl.classList.toggle('show', COVER*keep>0.01);
    } else if(dl){ dl.classList.remove('show'); } }
  /* ---------- interface rotation (snapped, animated) ---------- */
  // interface only flips between upright and upside-down; in landscape it stays where it was
  const upright = Math.abs(wrap(rawTarget)) < 0.6, flipped = Math.abs(wrap(rawTarget-Math.PI)) < 0.6;
  const snapT = upright?0 : flipped?Math.PI : uiSnap;
  if(Math.abs(wrap(snapT-uiSnap))>0.01 && !flip.on){
    uiSnap=snapT; layoutUI(uiSnap);
    if(REDUCED){ uiAngle=uiSnap; }
    else { Object.assign(flip,{on:true,t:0,to:uiSnap}); ui.classList.remove('emerging'); ui.classList.add('flipping'); }
  }
  if(flip.on){
    flip.t+=dt;
    uiFade = Math.max(0, 1-flip.t/0.35);
    // once the liquid has come to rest at the new bottom, the interface comes back — the right way up
    if(flip.t>1.7 && Math.abs(wrap(S.theta-target))<0.08){
      flip.on=false; uiAngle=uiSnap; uiFade=0;
      ui.style.transform=`translate(-50%,-50%) rotate(${uiAngle}rad)`;
      ui.classList.remove('flipping'); ui.classList.add('emerging');
      num.y = 0; num.vy = -60;                                 // the number rises out of the water into place
    }
  } else if(uiFade<1){ uiFade=Math.min(1, uiFade+dt/1.1); }
  else { uiAngle=uiSnap; }
  ui.style.transform=`translate(-50%,-50%) rotate(${uiAngle}rad)`;
  overlay.style.transform=ui.style.transform; overlay.style.width=ui.style.width; overlay.style.height=ui.style.height;

  Powder.draw(dt);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

/* ---------------- Sensors ---------------- */
let sensorSeen=false, motionSeen=false;
function screenAngle(){ return (screen.orientation && screen.orientation.angle) || window.orientation || 0; }
function onOrient(e){
  if(e.beta==null||e.gamma==null) return;
  sensorSeen=true; Dev.hide();
  const b=e.beta*Math.PI/180, gm=e.gamma*Math.PI/180;
  // gravity in device frame: (cos b sin g, -sin b, -cos b cos g)  → screen: x right, y down
  let gx=Math.cos(b)*Math.sin(gm), gy=Math.sin(b);
  const len=Math.hypot(gx,gy);
  if(len<0.12) return;                                   // lying flat: keep last direction
  gx/=len; gy/=len;
  // compensate if the OS rotated the viewport anyway
  const a=-screenAngle()*Math.PI/180, ca=Math.cos(a), sa=Math.sin(a);
  grav.x = gx*ca - gy*sa; grav.y = gx*sa + gy*ca;
}
function onMotion(e){
  const a=e.accelerationIncludingGravity; if(!a||a.x==null||a.y==null) return;
  if(sensorSeen) return;                                  // deviceorientation is authoritative when it works
  
  motionSeen=true; Dev.hide();
  const ios = typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function';
  const sgn = ios?-1:1;                                   // spec (Android/Chrome): face-up z=+9.8, upright y=+9.8. iOS is inverted.
  let gx=-sgn*a.x, gy=sgn*a.y; const len=Math.hypot(gx,gy); if(len<1.2) return;
  gx/=len; gy/=len;
  const r=-screenAngle()*Math.PI/180, ca=Math.cos(r), sa=Math.sin(r);
  grav.x = gx*ca - gy*sa; grav.y = gx*sa + gy*ca;
}

const perm=document.getElementById('perm');
async function enableMotion(){
  try{
    if(typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function'){
      const r=await DeviceOrientationEvent.requestPermission();
      if(r!=='granted') return;
    }
    if(typeof DeviceMotionEvent!=='undefined' && typeof DeviceMotionEvent.requestPermission==='function'){
      try{ await DeviceMotionEvent.requestPermission(); }catch(_){}
    }
    addEventListener('deviceorientation', onOrient, true);
    addEventListener('devicemotion', onMotion, true);
    perm.classList.remove('show'); localStorage.setItem('cost.motion','1');
    setTimeout(()=>{ if(!sensorSeen && !motionSeen) Mouse.enable(); }, 1500);   // no sensors: tilt with the pointer instead
  }catch(err){ console.warn(err); }
}
perm.addEventListener('click', enableMotion);
const needsPrompt = typeof DeviceOrientationEvent!=='undefined' && typeof DeviceOrientationEvent.requestPermission==='function';
const TOUCH = matchMedia('(pointer:coarse)').matches;
if(needsPrompt && !localStorage.getItem('cost.motion')){
  // iOS: ask on the first touch, silently; only show the button if that gets refused
  const first=()=>{ removeEventListener('pointerdown',first,true); enableMotion().then(()=>{ setTimeout(()=>{ if(!sensorSeen&&!motionSeen&&TOUCH) perm.classList.add('show'); },1200); }); };
  addEventListener('pointerdown', first, true);
}else{
  enableMotion();
  if(TOUCH){ const retry=()=>{ removeEventListener('pointerdown',retry,true); if(!sensorSeen&&!motionSeen) enableMotion(); }; addEventListener('pointerdown', retry, true); }
}
/* pointer tilt for desktop / anything without sensors */
const Mouse=(()=>{ let on=false;
  function move(e){ if(sensorSeen||motionSeen) return; const nx=(e.clientX/W-0.5)*2; const a=nx*0.3; grav.x=Math.sin(a); grav.y=Math.cos(a); }
  return { enable(){ if(on||TOUCH) return; on=true; addEventListener('pointermove',move,{passive:true}); } };
})();
// try to keep the viewport locked (works in fullscreen / PWA; silently ignored elsewhere)
try{ screen.orientation && screen.orientation.lock && screen.orientation.lock('portrait').catch(()=>{}); }catch(_){}

/* ---------------- Tap Dot ---------------- */
const say=document.getElementById('say'); let sayT;
async function tapDot(){
  dot.squashV = -3.5; dot.vy -= 16;
  S.amp = Math.min(26, S.amp + 6); S.sloshV += 0.35;
  dot.faceUntil = performance.now() + 6000;
  const pr=prodOf(cur); const text = await Assistant.respond({fill:FILL, production:pr.name, ...pr});
  say.textContent=text; say.classList.add('on'); Assistant.speak(text);
  clearTimeout(sayT); sayT=setTimeout(()=>say.classList.remove('on'), 4200);
}
/* swipe: the pour runs on its own at the speed you swiped; swipe the other way mid-pour to send it back */
let sw=null;
function uiDelta(e, st=sw){ const dx=e.clientX-st.x, dy=e.clientY-st.y; const c=Math.cos(-uiSnap), s=Math.sin(-uiSnap); return [dx*c-dy*s, dx*s+dy*c, dx, dy]; }
cv.addEventListener('pointerdown', e=>{ sw={x:e.clientX,y:e.clientY,t:performance.now()}; closeMenu(); try{ cv.setPointerCapture(e.pointerId); }catch(_){} });
let lastEnd=0;
function endDrag(e){
  if(!sw) return; const st=sw; sw=null; lastEnd=performance.now();
  const [ux,uy]=uiDelta(e, st), ms=Math.max(40, performance.now()-st.t);
  if(Math.abs(ux)>48 && Math.abs(ux)>Math.abs(uy)*1.3){
    const dir=ux<0?1:-1, speed=Math.abs(ux)/ms*1000;                      // px/s
    const rate=Math.max(0.2, Math.min(0.85, speed/Math.min(W,H)*0.55));   // slow swipe ≈ 5 s, quick flick ≈ 1.2 s
    if(pour.on){ if(dir!==pour.dir){ pour.rate=-rate; } else { pour.rate=Math.max(pour.rate,rate); } return; }
    if(beginPour(dir)){ pour.rate=rate; S.sloshV += dir*0.2*Math.min(1.6,rate*2); num.vy += 40; dot.vx += -dir*60*rate; }
    else S.sloshV += dir*0.6;
    return;
  }
  if(Math.hypot(e.clientX-st.x, e.clientY-st.y)<12 && Math.hypot(e.clientX-dot.x, e.clientY-dot.y) < dot.r*1.4) tapDot();
}
cv.addEventListener('pointerup', endDrag);
cv.addEventListener('pointercancel', ()=>{});                       // ignore: a real pointerup usually follows on touch
// touch fallback for browsers that cancel pointer events mid-gesture
let tsw=null;
cv.addEventListener('touchstart', e=>{ const t=e.touches[0]; tsw={x:t.clientX,y:t.clientY,t:performance.now()}; }, {passive:true});
cv.addEventListener('touchend', e=>{ if(!tsw) return; const t=e.changedTouches[0]; if(performance.now()-lastEnd>200){ sw=tsw; endDrag({clientX:t.clientX,clientY:t.clientY}); } tsw=null; }, {passive:true});

function beginPour(dir){
  const n=CONFIG.productions.length, next=cur+dir;
  if(next<0||next>=n) return false;
  Object.assign(pour,{on:true,p:0,dir,from:FILL,to:prodOf(next).fill,next,textOn:cur,rate:0});
  S.amp = Math.min(26, S.amp + 5);
  return true;
}
function pourText(){                                             // labels cross over with the front
  const want = pour.p>0.5 ? pour.next : cur;
  if(want!==pour.textOn){ pour.textOn=want; showText(want, pour.dir*(want===pour.next?1:-1)); }
}
function finishPour(){ pour.on=false; FILL=pour.to; pourTail=1.2; cur=pour.next; const p=prodOf(cur); fillTarget=p.fill; commitTarget=p.commitFrac; moodTarget=p.concern; coverTarget=p.cover; prevIndex=cur; pager(); renderReport(); }
function cancelPour(){ pour.on=false; FILL=pour.from; pourTail=0.6; if(pour.textOn!==cur) showText(cur,-pour.dir); }

function switchProduction(dir){
  if(pour.on) return;
  if(!beginPour(dir)){ S.sloshV += dir*0.6; return; }      // edge: just a nudge
  pour.rate = 0.3;                                          // ~3.3 s, for wheel / keys
  S.sloshV += dir*0.35; num.vy += 60; dot.vx += -dir*70;
}

/* ---------------- Actions menu ---------------- */

function closeMenu(){ setMenu(false); }

/* ---------------- Take Action screen (mock) ---------------- */
const sheet=$('sheet');

/* ---------------- Powder: the liquid breaks into fine grains and drifts off ---------------- */
const Powder=(()=>{
  let grains=[];
  return {
    burst(){
      if(REDUCED) return;
      grains=[];
      const R=Math.hypot(W,H)/2, cs=Math.cos(S.theta), sn=Math.sin(S.theta);
      const sy=surfaceLevel(S.theta, FILL*(1-DRAIN));
      for(let i=0;i<260;i++){
        const fx=(Math.random()-.5)*Math.min(W,H)*1.1, fy=sy+Math.random()*(R-sy)*0.9;   // inside the liquid, gravity frame
        const x=fx*cs-fy*sn+W/2, y=fx*sn+fy*cs+H/2;
        if(x<0||x>W||y<0||y>H) continue;
        grains.push({x,y, vx:(Math.random()-.5)*8, vy:-6-Math.random()*22, r:0.5+Math.random()*1.3,
          life:0, ttl:2.2+Math.random()*2.0, delay:Math.random()*1.1, w:Math.random()*6.28,
          c: Math.random()<0.7?'232,150,52':'250,200,120'});
      }
    },
    draw(dt){
      if(!grains.length) return;
      const gx=-grav.x*8, gy=-grav.y*8;   // grains lift gently against gravity
      for(const g of grains){
        g.life+=dt; if(g.life<g.delay) continue;
        const a=g.life-g.delay; g.vx+=(gx+Math.sin(S.t*2+g.w)*18)*dt; g.vy+=gy*dt;
        g.x+=g.vx*dt; g.y+=g.vy*dt;
        const al=Math.max(0, 1-a/g.ttl)*0.85;
        ctx.fillStyle=`rgba(${g.c},${al})`; ctx.beginPath(); ctx.arc(g.x,g.y,g.r,0,6.283); ctx.fill();
      }
      grains=grains.filter(g=>g.life-g.delay<g.ttl);
    }
  };
})();

/* ---------------- Puddle (unused now, kept for reference) ---------------- */
const Puddle=(()=>{
  let cv2=null, c2=null, t0=0, fill=0.5, seed=0;
  const harm=[[3,0.10],[5,0.05],[2,0.07],[7,0.025]];             // gentle irregularity, no lobes
  function radius(a,t){ let r=1; for(const [n,amp] of harm) r+=amp*Math.sin(n*a+seed+t*0.12*n); return r; }
  return {
    start(f){ fill=f; seed=Math.random()*6.28; t0=performance.now(); cv2=$('puddle'); c2=cv2.getContext('2d'); },
    draw(now){
      if(!cv2||!paper.classList.contains('open')) return;
      const w=parseFloat(overlay.style.width)||W, h=parseFloat(overlay.style.height)||H;
      if(cv2.width!==Math.round(w*DPR)){ cv2.width=w*DPR; cv2.height=h*DPR; }
      c2.setTransform(DPR,0,0,DPR,0,0); c2.clearRect(0,0,w,h);
      const t=(now-t0)/1000, spread=REDUCED?1:1-Math.pow(1-Math.min(1,t/3.4),3);   // slow ease-out spread
      // target area = what was in the glass; an ellipse wider than tall, centred low
      const A=fill*w*h*0.9, ratio=1.45;
      const ry=Math.sqrt(A/(Math.PI*ratio))*spread, rx=ry*ratio;
      const cx=w/2, cy=h*0.68;
      c2.save(); c2.translate(cx,cy);
      c2.beginPath();
      for(let i=0;i<=96;i++){ const a=i/96*Math.PI*2, r=radius(a,t); const x=Math.cos(a)*rx*r, y=Math.sin(a)*ry*r; i?c2.lineTo(x,y):c2.moveTo(x,y); }
      c2.closePath();
      const g=c2.createRadialGradient(-rx*0.2,-ry*0.3,0, 0,0,Math.max(rx,ry)*1.05);
      g.addColorStop(0,'rgba(240,176,88,0.60)'); g.addColorStop(0.55,'rgba(222,148,50,0.55)'); g.addColorStop(1,'rgba(196,118,34,0.50)');
      c2.fillStyle=g; c2.fill();
      c2.strokeStyle='rgba(255,240,210,0.55)'; c2.lineWidth=1.5; c2.stroke();     // wet rim
      c2.restore();
    }
  };
})();

/* ---------------- Cost report ----------------  */
const scrollPage=$('scrollPage'), liquidPane=$('liquidPane'), reportPane=$('reportPane');
/* swipe up from liquid pane to open report */
let swY=null,swX=null;
liquidPane.addEventListener('touchstart',e=>{ swY=e.touches[0].clientY; swX=e.touches[0].clientX; },{passive:true});
liquidPane.addEventListener('touchend',e=>{
  if(swY===null) return;
  const dy=swY-e.changedTouches[0].clientY, dx=Math.abs(e.changedTouches[0].clientX-swX);
  if(dy>50&&dx<60&&!sheet.classList.contains('open')&&!paper.classList.contains('open')) openReport();
  swY=null;
},{passive:true});

const reportWrap=reportPane; // alias for compatibility
let scrollLocked=false;
function snapScroll(target){ scrollPage.scrollTo({top:target,behavior:'smooth'}); }
// (no snap-on-settle: the page scrolls freely; chevron/keys/swipe use smooth scrollTo)
function renderReport(){
  const pr=prodOf(cur); $('reportTitle').innerHTML=pr.name+'<b>.</b>';
  const efc=pr.costToDate+pr.committed+pr.etc, variance=pr.budget-efc;
  $('repKpi').innerHTML=`
    <div><label>Budget</label><strong>${fmt(pr.budget)}</strong></div>
    <div><label>Cost to date</label><strong>${fmt(pr.costToDate)}</strong></div>
    <div><label>Committed</label><strong>${fmt(pr.committed)}</strong></div>
    <div><label>EFC</label><strong>${fmt(efc)}</strong></div>
    <div><label>Variance</label><strong class="${variance<0?'neg':'pos'}">${variance<0?'-':'+'}&thinsp;${fmt(Math.abs(variance))}</strong></div>`;
  let html='';
  for(const cat of (pr.costReport||[])){
    const sub=cat.items.reduce((t,i)=>t+i.actual,0);
    const budSub=cat.items.reduce((t,i)=>t+i.budget,0);
    html+=`<div class="rep-cat">${cat.cat}</div>`;
    for(const it of cat.items){
      const vc=it.variance>0?'pos':it.variance<0?'neg':'zero', sign=it.variance>0?'+':'';
      html+=`<div class="rep-row">
        <div class="rn"><strong>${it.role}</strong><span>${it.name}</span></div>
        <div class="rv budget">${fmt(it.budget)}</div>
        <div class="rv actual">${fmt(it.actual)}</div>
        <span class="rep-var ${vc}">${sign}${fmt(Math.abs(it.variance))}</span></div>`;
    }
  }
  $('repBody').innerHTML=html;
}
function openReport(){ renderReport(); scrollPage.scrollTo({top:liquidPane.offsetHeight,behavior:'smooth'}); }
function closeReport(){
  scrollPage.scrollTo({top:0,behavior:'smooth'});
}
$('reportBack').addEventListener('click', closeReport);
// chevron cycles to the next production; on last production, wraps or just bounces
$('chev').addEventListener('click', ()=>{
  const n=CONFIG.productions.length;
  if(reportWrap.classList.contains('open')) return;
  switchProduction(1);
});
// arrow keys switch productions
addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===']') switchProduction(1);
  if(e.key==='ArrowLeft'||e.key==='[') switchProduction(-1);
  if(e.key==='ArrowDown'&&!reportWrap.classList.contains('open')) openReport();
  if(e.key==='ArrowUp'&&reportWrap.classList.contains('open')) closeReport();
});

// drag up from plinth area opens report

/* ---------------- Invoices: the liquid spills onto a page ---------------- */
const paper=$('paper'); let paperT;
function openPaper(){
  const p=prodOf(cur), inv=p.invoices||[], open=inv.filter(i=>i.k!=='paid');
  $('paperSub').textContent=`${p.name} · ${open.length} open · ${fmt(open.reduce((t,i)=>t+i.amt,0))} outstanding`;
  $('paperList').innerHTML = inv.map(i=>`<div class="inv ${i.k}"><div class="t"><strong>${i.v}</strong><span>${i.n}</span><div class="st">${i.st}</div></div><em>${fmt(i.amt)}</em></div>`).join('')||'<div class="empty">No invoices yet.</div>';
  drainTarget=1; S.amp=Math.min(26,S.amp+8); S.sloshV-=0.5; num.vy+=120;
  scene.classList.add('laid');                            // the glass softens and blows away as powder
  // splash: one big puddle low on the page, droplets around it
  Powder.burst();
  clearTimeout(paperT);
  paperT=setTimeout(()=>{
    paper.classList.add('open'); paper.setAttribute('aria-hidden','false');
    // invoices come through the puddle one by one
    paper.querySelectorAll('header,.inv,.empty').forEach((el,k)=>el.style.animationDelay=(REDUCED?0:600+k*120)+'ms');
  }, REDUCED?0:1000);
}
function closePaper(){
  clearTimeout(paperT);
  paper.classList.remove('open'); paper.setAttribute('aria-hidden','true');
  setTimeout(()=>{ scene.classList.remove('laid'); drainTarget=0; S.amp=Math.min(26,S.amp+10); }, 300);   // stand the glass back up and refill
}
$('paperBack').addEventListener('click', closePaper);


let wheelCooldown=0;
addEventListener('wheel', e=>{
  const now=performance.now(); if(now-wheelCooldown<800) return;
  const d = Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;
  if(reportWrap.classList.contains('open')){
    if(d<-30){ wheelCooldown=now; closeReport(); }   // scroll up → back to liquid
  } else if(!sheet.classList.contains('open')&&!paper.classList.contains('open')){
    if(d>30){ wheelCooldown=now; openReport(); }     // scroll down → open report
  }
},{passive:true});


let dragY=null, dragX=null, dragOpen=false, dragAtTop=false;
function isInteractiveTarget(el){
  return el.closest('button,.menu,.sheet,.paper,#dev,#chev');
}

// general open gesture (canvas layer — not inside the report)
document.addEventListener('pointerdown',e=>{
  if(isInteractiveTarget(e.target)||reportWrap.classList.contains('open')) return;
  dragY=e.clientY; dragX=e.clientX; dragOpen=false;
});
document.addEventListener('pointerup',e=>{
  if(dragY===null||dragOpen) return;
  const dy=dragY-e.clientY, dx=Math.abs(e.clientX-dragX);
  if(dy>50&&dx<60&&!sheet.classList.contains('open')&&!paper.classList.contains('open')&&!isInteractiveTarget(e.target)){
    openReport();
  }
  dragY=null;
});


/* ---------------- DEV ONLY: orientation simulator ---------------- */
const Dev = (()=>{
  const el=document.getElementById('dev'), pad=document.getElementById('pad'), knob=pad.querySelector('i');
  let simAngle=0, shown=false;
  const set=(x,y)=>{ const l=Math.hypot(x,y)||1; grav.x=x/l; grav.y=y/l; knob.style.left=(50+grav.x*42)+'%'; knob.style.top=(50+grav.y*42)+'%'; };
  const setAngle=deg=>{ simAngle=deg; const a=deg*Math.PI/180; set(Math.sin(a), Math.cos(a)); };
  el.querySelectorAll('[data-o]').forEach(b=>b.addEventListener('click',()=>setAngle(+b.dataset.o)));
  let dragging=false;
  const fromEvt=e=>{ const r=pad.getBoundingClientRect(); set((e.clientX-r.left)/r.width*2-1, (e.clientY-r.top)/r.height*2-1); };
  pad.addEventListener('pointerdown',e=>{dragging=true; pad.setPointerCapture(e.pointerId); fromEvt(e)});
  pad.addEventListener('pointermove',e=>dragging&&fromEvt(e));
  pad.addEventListener('pointerup',()=>dragging=false);
  addEventListener('keydown',e=>{
    if(e.key==='ArrowLeft') setAngle(simAngle-15);
    if(e.key==='ArrowRight') setAngle(simAngle+15);
    if(e.key==='ArrowUp') setAngle(0);
    if(e.key==='ArrowDown') setAngle(180);
    if(e.key.toLowerCase()==='d'){ shown=!shown; el.classList.toggle('show',shown); }
  });
  // auto-show if no sensor data arrives (desktop / simulator)
  setTimeout(()=>{ if(!sensorSeen && !motionSeen && CONFIG.DEV_CONTROLS && !matchMedia('(pointer:coarse)').matches){ shown=true; el.classList.add('show'); } }, 1500);
  return { hide(){ if(shown && !localStorage.getItem('cost.devKeep')){ shown=false; el.classList.remove('show'); } } };
})();
